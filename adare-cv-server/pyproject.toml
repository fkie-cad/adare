[project]
name = "adare-cv-server"
version = "0.1.0"
description = "Computer vision and OCR server for Adare framework"
authors = [{name = "miqsoft", email = "mksaxhandball@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastmcp>=2.9.2",
    "click>=8.1.7",
    "opencv-python>=4.10.0",
    # OCR engine. Exact pins: preprocessing/runtime changes shift OCR results (and so
    # clicks); bump only together with the golden test and an A/B (see OCRProfiles).
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.7.2",
    "cairosvg>=2.7.1",
]

[project.optional-dependencies]
# Legacy OCR profile (paddle-legacy), kept until existing experiments are A/B-validated.
paddle = [
    "paddleocr>=3.1.0",
    "paddlepaddle==3.2.2",
]

[project.scripts]
adare-cv-server = "adare_cv_server.server:main"

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adare_cv_server"]
