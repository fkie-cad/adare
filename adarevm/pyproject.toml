[project]
name = "adarevm"
version = "0.2.0"
description = "ADARE guest agent: runs inside the VM and executes playbooks over WebSocket"
authors = [{name = "miqsoft", email = "mksaxhandball@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "adarelib",
    "pyautogui>=0.9.54",
    "pillow>=11.3.0",
    "websockets>=15.0",
    "cattrs>=23.2.3",
    "attrs>=24.0.0",
    "python-dateutil>=2.9.0.post0",
    "python-ulid>=2.7.0",
    "pytz>=2025.2",
]

[project.scripts]
adarevm = "adarevm.main:run"

[dependency-groups]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.uv.sources]
adarelib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
