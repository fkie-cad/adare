[project]
name = "adaredepend"
version = "0.1.0"
description = "ADARE workspace root: host client, guest agent, shared library and CV server"
authors = [{name = "miqsoft", email = "mksaxhandball@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "adarevm",
    "adare",
    "adarelib",
    "adare-cv-server",
]

[project.scripts]
adare = "adare.run:main"

[project.optional-dependencies]
docs = ["sphinx", "furo", "sphinx-design"]
qemu = ["adare[qemu]"]
# Local LocateAnything grounding backend (torch/MPS) for `adare dev agent
# --ground`. Non-commercial (NVIDIA) — opt-in: `uv sync --extra grounding`.
grounding = ["adare[grounding]"]

[dependency-groups]
# openpyxl: the excel testfunction declares it in its own
# appdata/testfunctions/excel/requirements.txt (installed into the *guest* at
# experiment time), but tests/unit/testfunctions/test_excel.py imports that module
# on the HOST, where pandas then needs the openpyxl engine. Without it 97 tests
# fail with ModuleNotFoundError — a test-only need, hence a test group rather than
# a runtime dependency of any shipped package.
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.0.0",
    "openpyxl>=3.1.0",
]
# Exact pins: a new ruff/mypy release can add rules or change inference, which
# would shift the quality-baseline.json counts. Bump deliberately, then
# `make lint-baseline`.
lint = [
    "ruff==0.15.11",
    "mypy==2.4.0",
]
dev = [
    {include-group = "lint"},
    "sphinx<8.0",
    "furo>=2025.7.1",
    "sphinx-design>=0.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "openpyxl>=3.1.0",
]
docs = [
    "sphinx<8.0",
    "furo>=2025.7.1",
    "sphinx-design>=0.6.0",
]

[tool.uv.sources]
adarevm = { workspace = true }
adare = { workspace = true }
adarelib = { workspace = true }
adare-cv-server = { workspace = true }

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.workspace]
members = ["adare", "adarevm", "adarelib", "adare-cv-server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# See adare/pyproject.toml for why live_vm is deselected by default. Kept in sync
# here because rootdir detection picks whichever pyproject.toml is nearest the
# test paths, so only patching one of the two leaves the hole open.
addopts = "--strict-markers --disable-warnings -m \"not live_vm\""
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as asyncio tests",
    "requires_qemu: needs a real qemu-img / qemu-system binary on PATH",
    "live_vm: boots a real VM (needs hardware acceleration and lots of time)"
]

[tool.coverage.run]
source = ["adare"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["paper", "docsrc/build"]

# Code that runs inside guest VMs must stay importable on the guests' Python
# (adarevm/adarelib declare >=3.10), so pyupgrade must not emit 3.11+ syntax there.
[tool.ruff.per-file-target-version]
"adarevm/**/*.py" = "py310"
"adarelib/**/*.py" = "py310"
"adare/appdata/testfunctions/**/*.py" = "py310"
"examples/testfunctions/**/*.py" = "py310"
# Their tests also run on 3.10 (`make test-testfunctions-guest`).
"adare/tests/unit/testfunctions/**/*.py" = "py310"

[tool.ruff.format]
# The codebase mixes quote styles; preserving them halves the reformat churn.
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "BLE", "S110", "S112", "C901", "I", "UP", "SIM", "RET"]
# The formatter owns line length; what it can't wrap (strings, comments, URLs) is fine.
# Legacy violations of the selected rules are budgeted in quality-baseline.json and
# enforced by scripts/quality_ratchet.py: counts may only go down.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["adare", "adarelib", "adarevm"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S"]
"**/testfunctions/test_*.py" = ["S", "F401", "E402", "I"]
"**/appdata/testfunctions/**/*.py" = ["I", "F401", "E402"]
# Scaffold copied to users: the imports are there as a starting point.
"**/appdata/templates/**/*.py" = ["F401"]
# Star re-exports kept for backwards compatibility.
"adare/adare/types/__init__.py" = ["F403", "F405"]
"adare/adare/logger/__init__.py" = ["F403"]
"adare/adare/frontend/interactive/dev_server.py" = ["F403"]

[tool.mypy]
python_version = "3.13"
# Pinned so `sys.platform` branches type-check the same on macOS and in CI.
platform = "linux"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# core is held at zero errors by `make typecheck`; services new defs must be
# typed too (its legacy untyped defs are budgeted by the ratchet).
module = ["adare.core.*", "adare.services.*"]
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaredepend"]
