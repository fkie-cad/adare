# LLM-free replay of a manual Ubuntu 20.04 desktop install (ubiquity installer).
# Replay with:
#   ./gui_install.py playbooks/ubuntu2004-desktop.yaml \
#       --iso ubuntu-20.04.6-desktop-amd64.iso --vm-dir /vms
#
# Buttons are driven by MOUSE CLICKS (tap), not keyboard: a click both focuses
# the installer window and activates the button, which is robust against the
# non-deterministic window focus at live-session startup. Coords are for the
# 1024x768 installer frame that qxl renders; ubiquity's layout matches 18.04, so
# these are the same coordinates verified on the 18.04 run. Accepts the geoip
# default timezone.
name: ubuntu2004-desktop
description: Ubuntu 20.04.6 Desktop via the graphical ubiquity installer
credentials: "user 'adare' / password 'adare' / host 'ubuntu2004'"

vm:
  ram_mb: 8192
  cpus: 4
  disk_size: "60G"
  vga: qxl
  firmware: bios

install:
  - {action: wait_stable, settle: 6, timeout: 360, min: 120, shot: welcome, note: "live session + Welcome (min skips early-boot plymouth)"}
  - {action: tap, coords: [763, 434, 1024, 768], note: "click 'Install Ubuntu'"}

  - {action: wait_stable, settle: 4, timeout: 120, shot: keyboard}
  - {action: tap, coords: [924, 566, 1024, 768], note: "Keyboard layout English(US): Continue"}

  - {action: wait_stable, settle: 4, timeout: 120, shot: updates}
  - {action: tap, coords: [924, 566, 1024, 768], note: "Updates/other software: Continue (leave defaults)"}

  - {action: wait_stable, settle: 6, timeout: 180, shot: installtype}
  - {action: tap, coords: [924, 566, 1024, 768], note: "'Erase disk' (default): Install Now"}

  - {action: wait_stable, settle: 4, timeout: 120, shot: writeconfirm}
  - {action: tap, coords: [897, 497, 1024, 768], note: "'Write changes?' dialog: Continue (point of no return)"}

  - {action: wait_stable, settle: 6, timeout: 180, shot: timezone}
  - {action: tap, coords: [924, 566, 1024, 768], note: "Timezone: Continue (geoip default; mouse avoids the city-entry focus trap)"}

  - {action: wait_stable, settle: 6, timeout: 120, shot: whoami}
  - {action: tap, coords: [594, 261, 1024, 768], note: "click 'Your name' field to focus the form"}
  - {action: type, text: "adare", note: "Your name"}
  - {action: key, keys: [tab], note: "-> computer name (auto-filled ugly value)"}
  - {action: key, keys: [ctrl, a], note: "select all"}
  - {action: type, text: "ubuntu2004", note: "computer name"}
  - {action: key, keys: [tab], repeat: 2, note: "-> password (skip auto-filled username)"}
  - {action: type, text: "adare", note: "password"}
  - {action: key, keys: [tab], note: "-> confirm password"}
  - {action: type, text: "adare"}
  - {action: shot, name: user-filled}
  - {action: tap, coords: [924, 566, 1024, 768], note: "Continue -> start install"}

  # Slideshow + progress keep the screen changing until the installer is idle;
  # it only settles when the 'Installation Complete' dialog appears.
  - {action: wait_stable, settle: 45, timeout: 3600, shot: complete, note: "wait for install to finish"}

reboot_from_disk: true

verify:
  - {action: wait_stable, settle: 8, timeout: 240, min: 45, shot: login, note: "GDM login screen (min skips reboot/boot)"}
  - {action: tap, coords: [505, 368, 1024, 768], note: "click the 'adare' user -> password prompt"}
  - {action: wait, seconds: 2}
  - {action: type, text: "adare", note: "password"}
  - {action: key, keys: [ret]}
  - {action: wait_stable, settle: 12, timeout: 180, shot: desktop, note: "GNOME desktop"}
