name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its running checks; pushes to dev/main all run to
# the end, so every commit there gets a result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs a Makefile target, so CI and your machine run the same commands;
# what a job installs and runs is defined there, not here. UV_LOCKED makes each
# sync fail if uv.lock is out of date (the same as passing --locked). uv brings
# its own Python (from requires-python, or --python in the Makefile), and
# setup-uv caches its downloads keyed on uv.lock and requirements*.txt.
env:
  UV_LOCKED: 1

jobs:
  # Formatting and the quality ratchet: ruff/mypy budgets, zero mypy errors in
  # adare.core, 1000-line file limit (see quality-baseline.json).
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install libvirt headers (qemu extra)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Format, strict types, quality ratchet
        run: make lint

  # Whole client unit suite on both host OSes (it includes the testfunction tests,
  # i.e. host test mode). Linux also enforces the coverage floor.
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: test-cov
          - os: macos-latest
            target: test
    steps:
      - uses: actions/checkout@v4

      - name: Install libvirt (qemu extra, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config

      - name: Install libvirt (qemu extra, macOS)
        if: runner.os == 'macOS'
        run: brew install libvirt pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run unit tests
        run: make ${{ matrix.target }}

      - name: Coverage summary
        if: always() && matrix.target == 'test-cov'
        working-directory: adare
        run: |
          echo "Unit-test line coverage: $(uv run --no-sync coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

  # Guest-side code on the oldest guest Python (3.10), outside the uv workspace:
  # the agent, and the testfunctions with their collections' requirements.
  guest:
    name: Guest code (${{ matrix.os }}, Python 3.10)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Agent tests
        run: make test-agent

      - name: Testfunction tests
        run: make test-testfunctions-guest

  cv-server:
    name: CV server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run CV server tests
        run: make test-cv

  # Built on every PR (warnings are errors), so a broken page fails here instead
  # of in the deploy from main (docs.yml).
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build documentation
        run: make docs

  # A fresh clone's `make install`, then `make update`, on every host OS.
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install libvirt (qemu extra, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config

      - name: Install libvirt (qemu extra, macOS)
        if: runner.os == 'macOS'
        run: brew install libvirt pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Install, update, run the CLI
        run: make test-install
