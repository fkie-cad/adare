name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Every job runs a Makefile target, so CI and your machine run the same commands;
# what a job installs and runs is defined there, not here. UV_LOCKED makes each
# sync fail if uv.lock is out of date (the same as passing --locked).
env:
  UV_LOCKED: 1

jobs:
  # Formatting, strict mypy on adare.core, and the quality ratchet (ruff/mypy
  # budgets + 1000-line file limit, see quality-baseline.json).
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install libvirt headers (qemu extra)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7

      - name: Format, strict types, quality ratchet
        run: make lint

  # Whole client unit suite.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install libvirt headers (qemu extra)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7

      - name: Run unit tests
        run: make test PYTEST_ARGS="--cov --cov-report="

      # Reported, not gated (yet): ~34% when introduced.
      - name: Coverage summary
        if: always()
        working-directory: adare
        run: |
          echo "Unit-test line coverage: $(uv run --no-sync coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

  # The guest agent runs on the guest's Python (3.10+), outside the uv workspace.
  agent:
    name: Guest agent (${{ matrix.os }}, Python 3.10)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Run agent tests
        run: make test-agent

  # CV server: PaddleOCR/OpenCV make this install heavy and the suite is young,
  # so it is reported but does not block merges (yet).
  cv-server:
    name: CV server (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7

      - name: Run CV server tests
        run: make test-cv

  # Testfunctions run inside Linux and Windows guests and on the macOS host (host
  # test mode), so their behaviour is checked on all three.
  testfunctions:
    name: Testfunctions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Run testfunction tests
        run: make test-testfunctions
