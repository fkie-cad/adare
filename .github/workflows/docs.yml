name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docsrc/**'
      - 'paper/demo/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Builds into docsrc/build/html, with the demo videos and .nojekyll.
      - name: Build documentation
        env:
          UV_LOCKED: 1
        run: make docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docsrc/build/html

      - id: deployment
        uses: actions/deploy-pages@v5
