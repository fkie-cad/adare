version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    # Only uv.lock moves; pyproject minimums stay. Raising them broke the guest
    # packages (adarevm/adarelib run on Python 3.10; e.g. pillow 13 needs 3.11).
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependabot pins one version for every Python split, which uv cannot resolve
    # here: new numpy/pandas drop Python 3.10 (the guests), and rapidocr pins
    # pyyaml exactly. Upgrade these by hand with `uv lock --upgrade-package`.
    ignore:
      - dependency-name: numpy
      - dependency-name: pandas
      - dependency-name: pyyaml
    groups:
      # Bumps shift quality-baseline.json counts; dependabot-baseline.yml re-measures
      # them on the PR (`make lint-baseline-deps`).
      lint-tools:
        patterns: [ruff, mypy]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [ruff, mypy]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Hook revs in .pre-commit-config.yaml (gitleaks, pre-commit-hooks, ruff). A ruff
  # rev bump fails `make ci-hygiene` until the ruff pins in both pyproject.toml lint
  # groups (and the ratchet hook's additional_dependencies) match, plus
  # `make lint-baseline`: finish that PR by hand.
  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      hooks:
        patterns: ['*']
