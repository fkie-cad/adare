version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bumping these shifts quality-baseline.json counts: re-run `make lint-baseline`.
      lint-tools:
        patterns: [ruff, mypy]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [ruff, mypy]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
