# Paper section 5.2 -- Artifact Regression Testing, Kubuntu 20.04 (KDE Plasma / Dolphin).
#
# Same interaction as every other section 5.2 experiment: create a document and open it
# exactly once through the file manager.
#
# Expected outcome for this distro/version: the XDG recently-used artifact is ABSENT.
# The paper reports that on Kubuntu the artifact is not written in 20.04 and 22.04, but
# is written in 24.04 after the identical interaction.
#
# The absence claim is expressed positively (standard.file_does_not_exist) rather than via
# expect_to_fail, and it is deliberately NOT trivial: the full interaction runs first, and
# text_file_accessed proves the document really was read by an application afterwards, so
# a missing artifact cannot be confused with a missing interaction.
#
# GUI icon img/dolphin_taskbar.png is reused from section 5.1
# (paper/experiments/1_artifact_research/playbooks/deletefile_dolphin_by_click) and is a
# rasterization of upstream KDE Breeze art, NOT a crop from a live VM. On kubuntu-2404 it
# matched the live Plasma panel launcher at 0.915 confidence without being re-taken, so the
# crop is probably good enough here too; a failing first click is the signal to re-take it.
#
# THE OPEN IS 'select, then Enter', NOT `click: {type: double}` -- a QMP-synthesised double
# click does not reach Qt item views as a double click. Measured on kubuntu-2404 (Plasma
# 5.27.12/X11) on 2026-07-28: run 01KYM8ZT5DW75R6TAFCYHJDW8Z selected the document but never
# opened it, its access time stayed at the pinned 2000-01-01 and no artifact appeared; a dev
# session replay behaved the same; and three hand-rolled QMP double clicks sent straight down
# the monitor socket (ADARE's own timings, the same without re-sending the position between
# clicks, and the whole down/up/down/up in ONE input-send-event) all selected without
# activating. The same `type: double` works on GNOME/Nautilus (Ubuntu 24.04 run
# 01KYDKKQ3CNVJGWQNREN1), so this is a Qt-side limitation, not a broken playbook.
# Enter activates the selected item exactly once, which is the interaction the paper means.
# This matters MORE here than on 24.04: the absence claim below is only meaningful if the
# document really was opened, which is what text_file_accessed checks.
#
# NOTE for 20.04 specifically: Plasma 5.18 is often described as defaulting to SINGLE-click
# activation, which would make the selecting click open the document and Enter open it a
# second time. That is NOT what this image does. Measured on kubuntu-2004-r2 2026-07-28: in run
# 01KYMJBGA6D0YQZB0RPD1AW1VH a single click on the "Documents" folder label only selected it
# (Dolphin stayed in Home, status bar "Documents (folder)"), so this release is in double-click
# mode too and 'exactly once' does hold. The absence claim below would survive either way --
# it only needs the document to have been read at all -- but the count is trustworthy here.

settings:
  idle: 2.0
  timeout: 600
  screenshot:
    format: "png"
    quality: 95

variables:
  filename:
    type: string
    value: "adare.txt"
    description: "Name of the document that gets created and opened once"

  text_file:
    type: path
    value: "{{ adare_user_documents }}/{{ filename }}"
    description: "Full path of the document that gets opened"

  xbel_file:
    type: path
    value: "{{ adare_user_home }}/.local/share/recently-used.xbel"
    description: "XDG recently-used artifact that is expected NOT to appear"

  icon_filemanager_taskbar:
    type: string
    value: "dolphin_taskbar.png"
    description: "Taskbar icon of the KDE file manager (Dolphin)"

  file_content:
    type: string
    value: "This is test text"
    description: "Document content, also used as the on-screen proof that the editor opened it"


tests:
  # --- pre-conditions ---
  - name: xbel_absent_before
    description: 'Verify the recently-used artifact is absent before the interaction'
    function: standard.file_does_not_exist
    parameter:
      dst: '{{ xbel_file }}'

  - name: text_file_created
    description: 'Verify the document to be opened exists before the interaction'
    function: standard.file_exists
    parameter:
      dst: '{{ text_file }}'

  # --- paper claim: "on Kubuntu, the artifact was absent in 20.04 and 22.04" ---
  - name: xbel_absent_after_open
    description: 'REGRESSION EXPECTATION: opening a document on Kubuntu 20.04 does not create recently-used.xbel'
    function: standard.file_does_not_exist
    parameter:
      dst: '{{ xbel_file }}'

  # --- the absence must be attributable to the platform, not to a failed interaction ---
  # atime was reset to 2000-01-01 immediately before the opening click, so a recent access
  # time can only come from the document actually being read afterwards.
  - name: text_file_accessed
    description: 'The document was read after the opening click, so the absent artifact is a platform behaviour and not a missed interaction'
    function: standard.file_timestamps
    parameter:
      dst: '{{ text_file }}'
      timestamp_type: 'accessed'
      comparison_type: 'within_last'
      within_duration: '30m'


actions:
  - command:
      name: "Ensure recently-used.xbel is absent"
      description: "Start from a state in which the artifact under test does not exist"
      command: "rm -f {{ xbel_file }}"
  - test: xbel_absent_before

  - command:
      name: "Create text file to be opened"
      description: "Create the document that will be opened exactly once"
      command: "echo '{{ file_content }}' > {{ text_file }}"
      shell: true
  - test: text_file_created

  # Dolphin is opened through the Application Launcher, NOT through a panel icon: this image's
  # panel has no Dolphin launcher to click. Measured on kubuntu-2004-r2, 2026-07-28 -- the
  # panel holds only the Kickoff button and the system tray
  # (~/.config/plasma-org.kde.plasma.desktop-appletsrc has no `launchers` entry at all), so
  # `click: {target: {image: dolphin_taskbar.png}}` had nothing to hit: run
  # 01KYMH5MNPMPQ3SPJ6Z8DM9ZGZ scored only 0.752 and clicked (1834, 935), empty desktop next
  # to a "Ubuntu 22.04.5 LTS upgrade available" notification, and "Documents" never appeared.
  # The variable icon_filemanager_taskbar is kept but unused, so the 22.04/24.04 variants stay
  # diffable against this file.
  - keyboard:
      key: "super"
      description: "Open the Plasma Application Launcher (Kickoff)"
  - keyboard:
      text: "dolphin"
      description: "Type the file manager's name into Kickoff's search box"
  - keyboard:
      key: down
      description: "Highlight the first result -- Kickoff on Plasma 5.18 does not pre-highlight it, so a bare Enter does nothing"
  - keyboard:
      key: enter
      description: "Launch the KDE file manager (Dolphin)"
  - wait_until:
      condition:
        exists:
          text: "Documents"
      description: "Wait for the Dolphin Places panel to be usable"

  # index 1, not the 2 the other variants use. OCR sees THREE "Documents" on this release's
  # Dolphin -- the Places entry at (52, 154), the folder label in the icon view at (399, 187),
  # and a "Search For > Documents" row at (52, 410) that Plasma 5.18 puts in the sidebar and
  # later releases do not. Sweep indices are 1-based over the matches sorted top-to-bottom, so
  # index 2 picks the icon-view LABEL here, and clicking a label only selects: run
  # 01KYMJBGA6D0YQZB0RPD1AW1VH left Dolphin in Home with "Documents (folder)" in the status bar
  # and never listed adare.txt. index 1 is the Places sidebar entry, which navigates on a single
  # click -- the same element the 24.04 variant ends up hitting with its index 2.
  - click:
      target:
        text: "Documents"
        strategy:
          SweepStrategy:
            index: 1
      description: "Navigate to the Documents folder via the Places sidebar"
  - wait_until:
      condition:
        exists:
          text: "{{ filename }}"
      description: "Wait for the document to be listed"

  # Reset atime AFTER navigation so that Dolphin's text preview cannot be mistaken for
  # the opening read.
  - command:
      name: "Reset access time of the document"
      description: "Pin atime to 2000-01-01 so a later access time proves the document was opened"
      command: "touch -a -t 200001010000 {{ text_file }}"

  - click:
      target:
        text: "{{ filename }}"
      description: "Select the document (see 'select, then Enter' at the top)"
  - keyboard:
      key: enter
      description: "Open the document"

  - wait_until:
      condition:
        exists:
          text: "{{ file_content }}"
      timeout: 60.0
      description: "Editor shows the document content -- runtime proof that the open succeeded"
  - idle:
      duration: 5
      description: "Give the platform the same chance to write the artifact as on 24.04"

  - test: xbel_absent_after_open
  - test: text_file_accessed

  # No pull action: there is no artifact to pull on this distro/version.
