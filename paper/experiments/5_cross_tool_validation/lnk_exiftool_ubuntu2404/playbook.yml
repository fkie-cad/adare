# Experiment: Cross-Tool Validation — ExifTool (Linux)
# Paper: section 5.5, Table 1 row "ExifTool / Ubuntu 24.04 / L1 ✓ L2 ✓ L3 ✓ / Verbosity: Low"
# Purpose: parse three LNK samples with ExifTool and assert, per sample, that the
#          parse succeeded and the recovered link fields are the expected ones.
#          L2/L3 carry non-standard appended data that ExifTool tolerates — it
#          reports the remainder as an unparsed overlay and still recovers every
#          link field. That tolerance is the assertion, not an aside.
# Samples:  generated by provisioning/make_lnk_samples.py into the PROJECT-level
#           shared/data (see provisioning/README.md). The real VirusTotal samples
#           are not committed.

settings:
  idle: 1.0
  timeout: 1200
  screenshot:
    format: "png"
    quality: 95

variables:
  sample_dir:
    type: path
    value: "{{ adare_project_shared_data }}"
    description: "Project-level shared data holding L1.lnk / L2.lnk / L3.lnk"

  out_dir:
    type: path
    value: "{{ adare_user_home }}/adare_lnk_exiftool"
    description: "In-guest scratch directory for parser output"

  # NOTE: `exiftool_version` is deliberately NOT declared here. It is created at
  # runtime by the `capture:` on the version command below, which is what registers
  # it with the run record. Declaring it as well is legal but makes the validator
  # emit a duplicate-definition warning for no benefit.

tests:
  # --- tool provenance -------------------------------------------------------
  - name: exiftool_version_recorded
    description: "The captured ExifTool version has a plausible shape, proving the capture worked"
    function: standard.file_content_matches_regex
    parameter:
      dst: '{{ out_dir }}/tool_version.txt'
      regex: '^\d+\.\d+'

  - name: exiftool_version_matches_paper
    description: >-
      Pins the ExifTool version to the one recorded in the paper's Appendix A (12.76,
      which is what Ubuntu 24.04 ships). This test is EXPECTED TO FAIL on any other
      environment — that is deliberate: it turns silent tool drift into a red test,
      which is the whole argument of section 5.2.
    function: standard.file_content_matches_regex
    parameter:
      dst: '{{ out_dir }}/tool_version.txt'
      regex: '^12\.76'

  # --- L1: structurally valid ------------------------------------------------
  - name: l1_output_exists
    description: "ExifTool produced JSON output for L1"
    function: standard.file_exists
    parameter:
      dst: '{{ out_dir }}/exiftool_L1.flat.json'

  - name: l1_exit_code_zero
    description: "ExifTool parsed L1 successfully (Table 1: ✓)"
    function: standard.file_content_equals
    parameter:
      dst: '{{ out_dir }}/rc_L1.txt'
      content: "0"

  - name: l1_filetype_is_lnk
    description: "ExifTool identified L1 as a Windows shell link"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L1.flat.json'
      key_path: FileType
      expected_value: "LNK"

  - name: l1_target_file_size
    description: "ExifTool recovered the target file size from the ShellLinkHeader"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L1.flat.json'
      key_path: TargetFileSize
      expected_value: 201216

  - name: l1_local_base_path
    description: "ExifTool recovered the LinkInfo LocalBasePath"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L1.flat.json'
      key_path: LocalBasePath
      expected_value: 'C:\Windows\System32\notepad.exe'

  - name: l1_working_directory
    description: "ExifTool recovered the WORKING_DIR string"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L1.flat.json'
      key_path: WorkingDirectory
      expected_value: 'C:\Windows\System32'

  - name: l1_no_overlay_warning
    description: "L1 is clean: ExifTool reports no unparsed trailing data"
    function: json.contains_key
    parameter:
      dst: '{{ out_dir }}/exiftool_L1.flat.json'
      key_path: Warning
    expect_to_fail: true

  # --- L2: valid link + 512 bytes of non-standard appended data --------------
  - name: l2_output_exists
    description: "ExifTool produced JSON output for L2"
    function: standard.file_exists
    parameter:
      dst: '{{ out_dir }}/exiftool_L2.flat.json'

  - name: l2_exit_code_zero
    description: "ExifTool tolerated L2's appended data and still exited 0 (Table 1: ✓)"
    function: standard.file_content_equals
    parameter:
      dst: '{{ out_dir }}/rc_L2.txt'
      content: "0"

  - name: l2_filetype_is_lnk
    description: "ExifTool still identified L2 as a shell link despite the appended data"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L2.flat.json'
      key_path: FileType
      expected_value: "LNK"

  - name: l2_local_base_path
    description: "ExifTool recovered L2's LocalBasePath — the appended data did not block parsing"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L2.flat.json'
      key_path: LocalBasePath
      expected_value: 'C:\Windows\System32\notepad.exe'

  - name: l2_working_directory
    description: "ExifTool recovered L2's WORKING_DIR string"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L2.flat.json'
      key_path: WorkingDirectory
      expected_value: 'C:\Windows\System32'

  - name: l2_reports_appended_data
    description: >-
      ExifTool notices the appended bytes and says so rather than failing. This is the
      positive form of the paper's claim that ExifTool "tolerated and bypassed" the
      appended data.
    function: json.contains_key
    parameter:
      dst: '{{ out_dir }}/exiftool_L2.flat.json'
      key_path: Warning

  # --- L3: valid link + 4096 bytes of non-standard appended data -------------
  - name: l3_output_exists
    description: "ExifTool produced JSON output for L3"
    function: standard.file_exists
    parameter:
      dst: '{{ out_dir }}/exiftool_L3.flat.json'

  - name: l3_exit_code_zero
    description: "ExifTool tolerated L3's larger appended payload and still exited 0 (Table 1: ✓)"
    function: standard.file_content_equals
    parameter:
      dst: '{{ out_dir }}/rc_L3.txt'
      content: "0"

  - name: l3_filetype_is_lnk
    description: "ExifTool still identified L3 as a shell link despite the appended data"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L3.flat.json'
      key_path: FileType
      expected_value: "LNK"

  - name: l3_local_base_path
    description: "ExifTool recovered L3's LocalBasePath — payload size does not change the outcome"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L3.flat.json'
      key_path: LocalBasePath
      expected_value: 'C:\Windows\System32\notepad.exe'

  - name: l3_working_directory
    description: "ExifTool recovered L3's WORKING_DIR string"
    function: json.value_matches
    parameter:
      dst: '{{ out_dir }}/exiftool_L3.flat.json'
      key_path: WorkingDirectory
      expected_value: 'C:\Windows\System32'

  - name: l3_reports_appended_data
    description: "ExifTool notices L3's appended bytes and says so rather than failing"
    function: json.contains_key
    parameter:
      dst: '{{ out_dir }}/exiftool_L3.flat.json'
      key_path: Warning

actions:
  # --- setup and tool provenance --------------------------------------------
  - command:
      name: "Prepare output directory"
      command: "rm -rf {{ out_dir }} && mkdir -p {{ out_dir }}"
      shell: true

  - command:
      name: "Record ExifTool version"
      description: "Capture the version so the run documents which parser produced Table 1"
      command: "exiftool -ver | tee {{ out_dir }}/tool_version.txt"
      shell: true
      capture:
        variable: exiftool_version
        source: stdout

  - test: exiftool_version_recorded
  - test: exiftool_version_matches_paper

  # --- L1 -------------------------------------------------------------------
  # `-json` always emits a JSON *array*, even for one file, and the json.* test
  # functions cannot address a top-level array (json/json.py:_get_nested_value
  # only descends into dicts). So the raw array is kept as the forensic artifact
  # and a flattened single-object copy is written alongside it for the assertions.
  - command:
      name: "ExifTool on L1"
      command: "exiftool -json '{{ sample_dir }}/L1.lnk' > {{ out_dir }}/exiftool_L1.json 2> {{ out_dir }}/exiftool_L1.err.txt; echo $? > {{ out_dir }}/rc_L1.txt"
      shell: true
      allow_failure: true
      timeout: 120

  - command:
      name: "Flatten L1 JSON array to a single object"
      command: "python3 -c \"import json,pathlib; p=pathlib.Path('{{ out_dir }}/exiftool_L1.json'); d=json.loads(p.read_text()); pathlib.Path('{{ out_dir }}/exiftool_L1.flat.json').write_text(json.dumps(d[0], indent=2))\""
      shell: true

  - test: l1_output_exists
  - test: l1_exit_code_zero
  - test: l1_filetype_is_lnk
  - test: l1_target_file_size
  - test: l1_local_base_path
  - test: l1_working_directory
  - test: l1_no_overlay_warning

  - pull:
      description: "Collect L1 artifacts on the host for the Table 1 normalizer"
      src:
        - "{{ out_dir }}/exiftool_L1.json"
        - "{{ out_dir }}/exiftool_L1.flat.json"
        - "{{ out_dir }}/exiftool_L1.err.txt"
        - "{{ out_dir }}/rc_L1.txt"
        - "{{ out_dir }}/tool_version.txt"

  # --- L2 -------------------------------------------------------------------
  - command:
      name: "ExifTool on L2"
      command: "exiftool -json '{{ sample_dir }}/L2.lnk' > {{ out_dir }}/exiftool_L2.json 2> {{ out_dir }}/exiftool_L2.err.txt; echo $? > {{ out_dir }}/rc_L2.txt"
      shell: true
      allow_failure: true
      timeout: 120

  - command:
      name: "Flatten L2 JSON array to a single object"
      command: "python3 -c \"import json,pathlib; p=pathlib.Path('{{ out_dir }}/exiftool_L2.json'); d=json.loads(p.read_text()); pathlib.Path('{{ out_dir }}/exiftool_L2.flat.json').write_text(json.dumps(d[0], indent=2))\""
      shell: true

  - test: l2_output_exists
  - test: l2_exit_code_zero
  - test: l2_filetype_is_lnk
  - test: l2_local_base_path
  - test: l2_working_directory
  - test: l2_reports_appended_data

  - pull:
      description: "Collect L2 artifacts on the host"
      src:
        - "{{ out_dir }}/exiftool_L2.json"
        - "{{ out_dir }}/exiftool_L2.flat.json"
        - "{{ out_dir }}/exiftool_L2.err.txt"
        - "{{ out_dir }}/rc_L2.txt"

  # --- L3 -------------------------------------------------------------------
  - command:
      name: "ExifTool on L3"
      command: "exiftool -json '{{ sample_dir }}/L3.lnk' > {{ out_dir }}/exiftool_L3.json 2> {{ out_dir }}/exiftool_L3.err.txt; echo $? > {{ out_dir }}/rc_L3.txt"
      shell: true
      allow_failure: true
      timeout: 120

  - command:
      name: "Flatten L3 JSON array to a single object"
      command: "python3 -c \"import json,pathlib; p=pathlib.Path('{{ out_dir }}/exiftool_L3.json'); d=json.loads(p.read_text()); pathlib.Path('{{ out_dir }}/exiftool_L3.flat.json').write_text(json.dumps(d[0], indent=2))\""
      shell: true

  - test: l3_output_exists
  - test: l3_exit_code_zero
  - test: l3_filetype_is_lnk
  - test: l3_local_base_path
  - test: l3_working_directory
  - test: l3_reports_appended_data

  - pull:
      description: "Collect L3 artifacts on the host"
      src:
        - "{{ out_dir }}/exiftool_L3.json"
        - "{{ out_dir }}/exiftool_L3.flat.json"
        - "{{ out_dir }}/exiftool_L3.err.txt"
        - "{{ out_dir }}/rc_L3.txt"
