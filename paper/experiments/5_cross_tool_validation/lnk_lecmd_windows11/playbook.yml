# Experiment: Cross-Tool Validation — LECmd (Windows)
# Paper: section 5.5, Table 1 row "LECmd / Windows 11 / L1 ✓ L2 ✓ L3 ✓ / Verbosity: High"
# Purpose: parse three LNK samples with LECmd and assert, per sample, that the parse
#          succeeded and the recovered link fields are the expected ones. L2/L3 carry
#          non-standard appended data that LECmd tolerates where lnkinfo does not.
# Samples:  generated by provisioning/make_lnk_samples.py into the PROJECT-level
#           shared/data (see provisioning/README.md).
#
# MEASURED IN-GUEST 2026-07-28 on win11arm64-fresh (Windows 11 Pro 26200 ARM64,
# .NET Framework 4.8.09221 / Release 533509). The two host-unverifiable assumptions both
# HOLD, and three things that were wrong were found and fixed here:
#   1. `--json` writes ONE JSON object on ONE line per invocation — newline-delimited JSON,
#      exactly as the sibling tool PECmd behaves. `jsonl.line_matches` is correct.
#   2. LECmd exits 0 on a successful parse of all three samples (L1/L2/L3), so
#      `l*_exit_code_zero` is correct and Table 1's LECmd row ✓ ✓ ✓ reproduces.
#   3. FIXED — LECmd.exe cannot be EXECUTED from the shared-tools mount. That mount is a
#      symlink to a QEMU/Samba share (`C:\adare\project_shared` ->
#      `\\10.0.2.4\qemu\project_shared`) whose files carry read-only ACLs
#      (`Everyone:(R)`, no (X)), so CreateProcess returns ERROR_ACCESS_DENIED:
#          Program 'LECmd.exe' failed to run: Access is denied     (HRESULT 0x80131501)
#      No process is created, so there is no stdout, no stderr and no $LASTEXITCODE —
#      which is exactly why the version capture produced an EMPTY tool_version.txt on the
#      first run and `lecmd_version_recorded` failed. Reading from the share is fine; only
#      execution is denied. The tool is therefore STAGED to a local disk first (see
#      `tool_dir` / "Stage LECmd.exe" below) and every invocation uses the staged copy.
#   4. FIXED — `--jsonf` DOES NOT EXIST in LECmd (it exists in PECmd). LECmd answers
#      `'--jsonf' was not matched. Did you mean one of the following? --json` and then
#      exits with its usage screen. `--json <dir>` auto-names the file
#      `<yyyyMMddHHmmss>_LECmd_Output.json`, so each invocation writes into a scratch
#      directory and the single produced file is renamed to `lecmd_L<n>.json` (the name
#      `provisioning/normalize_lnk_outputs.py` expects).
# See ../README.md for the run IDs.

settings:
  idle: 2.0
  timeout: 1800
  screenshot:
    format: "png"
    quality: 95

variables:
  sample_dir:
    type: path
    value: "{{ adare_project_shared_data }}"
    description: "Project-level shared data holding L1.lnk / L2.lnk / L3.lnk"

  out_dir:
    type: path
    value: "{{ adare_user_documents }}/adare_lnk_lecmd"
    description: "In-guest scratch directory for parser output"

  tool_dir:
    type: path
    value: "{{ out_dir }}/tool"
    description: >-
      Local-disk staging directory for LECmd.exe. The shared-tools mount is a read-only
      Samba share and Windows refuses to execute an image from it (see note 3 in the
      header), so the binary is copied here first and removed again at the end of the run.

  raw_json_dir:
    type: path
    value: "{{ out_dir }}/raw"
    description: >-
      Scratch directory for LECmd's auto-named `<timestamp>_LECmd_Output.json`. Emptied
      before each invocation so exactly one file is present afterwards and can be renamed
      deterministically — LECmd has no --jsonf to name the output directly.

  # `lecmd_version` is created at runtime by the `capture:` below.

tests:
  # --- tool provenance -------------------------------------------------------
  - name: lecmd_version_recorded
    description: "The captured LECmd banner has a plausible version, proving the capture worked"
    function: standard.file_content_matches_regex
    parameter:
      dst: '{{ out_dir }}/tool_version.txt'
      regex: 'v?\d+\.\d+\.\d+'
      strip_bom: true

  # RE-BASELINED 2026-07-28, from the paper's Appendix-A version 1.5.1 to 2026.5.0.
  #
  # What changed in the world: LECmd 1.5.1 is no longer distributed. Eric Zimmerman's tools
  # are served only as current builds from ericzimmermanstools.com, there is no version
  # archive, and the project has since moved from semantic versioning to date-based
  # versioning — the obtainable binary self-reports `LECmd version 2026.5.0`
  # (FileVersion 2026.5.0.0, informational version
  # 2026.5.0+def1fc2686af4684d06a889b1315f225187ac8f7). Under the old scheme a "1.x"
  # release cannot be produced at all any more, so a pin on 1.5.1 is not a drift detector,
  # it is a permanently red test that no obtainable binary can ever satisfy.
  #
  # The pin's PURPOSE is preserved, not weakened: it still fails on any build other than
  # the one this case study was actually measured against, so a future LECmd that changes
  # its L2/L3 tolerance turns this red instead of silently changing what Table 1 means.
  # What is lost is the ability to reproduce the paper's exact binary; that is recorded in
  # ../README.md as an unreproducible detail rather than hidden behind a green test.
  - name: lecmd_version_matches_paper
    description: >-
      Pins LECmd to the version this case study was measured against (2026.5.0), the
      obtainable stand-in for the paper's Appendix-A 1.5.1, which is no longer
      distributed. EXPECTED TO FAIL on any other build — deliberately, so tool drift
      surfaces as a red test instead of quietly changing what Table 1 means.
    function: standard.file_content_matches_regex
    parameter:
      dst: '{{ out_dir }}/tool_version.txt'
      regex: 'LECmd version 2026\.5\.0'
      strip_bom: true

  # --- L1: structurally valid ------------------------------------------------
  - name: l1_output_exists
    description: "LECmd produced JSON output for L1"
    function: standard.file_exists
    parameter:
      dst: '{{ out_dir }}/lecmd_L1.json'

  # MEASURED CAVEAT: LECmd exits 0 on a *usage* error too — pointing `-f` at a path that
  # does not exist makes it print its help screen and still return 0. So the `l*_exit_code_zero`
  # tests are necessary but not sufficient: `l*_output_exists` plus the field assertions are
  # what actually distinguish a successful parse from a mis-invocation. Keep both.
  - name: l1_exit_code_zero
    description: "LECmd parsed L1 successfully (Table 1: ✓)"
    function: standard.file_content_equals
    parameter:
      dst: '{{ out_dir }}/rc_L1.txt'
      content: "0"

  - name: l1_source_file
    description: "The JSON record names L1 as the parsed source file"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L1.json'
      conditions:
        SourceFile: 'L1\.lnk$'
      match_mode: any
      regex_match: true

  - name: l1_local_path
    description: "LECmd recovered the LinkInfo local path"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L1.json'
      conditions:
        LocalPath: 'C:\Windows\System32\notepad.exe'
      match_mode: any

  - name: l1_working_directory
    description: "LECmd recovered the WORKING_DIR string"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L1.json'
      conditions:
        WorkingDirectory: 'C:\Windows\System32'
      match_mode: any

  - name: l1_volume_label
    description: "LECmd recovered the VolumeID label — part of its high verbosity"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L1.json'
      conditions:
        VolumeLabel: 'ADARE-LAB'
      match_mode: any

  # --- L2: valid link + 512 bytes of non-standard appended data --------------
  - name: l2_output_exists
    description: "LECmd produced JSON output for L2 despite the appended data"
    function: standard.file_exists
    parameter:
      dst: '{{ out_dir }}/lecmd_L2.json'

  - name: l2_exit_code_zero
    description: "LECmd tolerated L2's appended data and still exited 0 (Table 1: ✓)"
    function: standard.file_content_equals
    parameter:
      dst: '{{ out_dir }}/rc_L2.txt'
      content: "0"

  - name: l2_local_path
    description: >-
      LECmd recovered L2's local path. This is the direct counterpart of lnkinfo's ✗ on
      the same bytes — the same appended data, a different tolerance decision.
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L2.json'
      conditions:
        LocalPath: 'C:\Windows\System32\notepad.exe'
      match_mode: any

  - name: l2_working_directory
    description: "LECmd recovered L2's WORKING_DIR string"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L2.json'
      conditions:
        WorkingDirectory: 'C:\Windows\System32'
      match_mode: any

  # --- L3: valid link + 4096 bytes of non-standard appended data -------------
  - name: l3_output_exists
    description: "LECmd produced JSON output for L3 despite the larger appended payload"
    function: standard.file_exists
    parameter:
      dst: '{{ out_dir }}/lecmd_L3.json'

  - name: l3_exit_code_zero
    description: "LECmd tolerated L3's appended data and still exited 0 (Table 1: ✓)"
    function: standard.file_content_equals
    parameter:
      dst: '{{ out_dir }}/rc_L3.txt'
      content: "0"

  - name: l3_local_path
    description: "LECmd recovered L3's local path — payload size does not change the outcome"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L3.json'
      conditions:
        LocalPath: 'C:\Windows\System32\notepad.exe'
      match_mode: any

  - name: l3_working_directory
    description: "LECmd recovered L3's WORKING_DIR string"
    function: jsonl.line_matches
    parameter:
      dst: '{{ out_dir }}/lecmd_L3.json'
      conditions:
        WorkingDirectory: 'C:\Windows\System32'
      match_mode: any

actions:
  # --- setup and tool provenance --------------------------------------------
  # The guest shell is PowerShell. Two Windows-specific details matter here:
  #   * `$?` is a boolean in PowerShell — the exit code is `$LASTEXITCODE`.
  #   * `>` and `Out-File` default to UTF-16LE / UTF-8-with-BOM depending on the
  #     PowerShell version, which the test functions would then misread. The rc and
  #     version files are therefore written with [IO.File]::WriteAllText, which emits
  #     UTF-8 without a BOM; the console logs use -Encoding ascii. `strip_bom: true`
  #     on the version assertions is belt-and-braces for older hosts.
  - command:
      name: "Prepare output directory"
      command: 'if (Test-Path "{{ out_dir | win_path }}") { Remove-Item -Recurse -Force "{{ out_dir | win_path }}" }; New-Item -ItemType Directory -Force -Path "{{ out_dir | win_path }}","{{ tool_dir | win_path }}","{{ raw_json_dir | win_path }}" | Out-Null'
      shell: true

  - command:
      name: "Stage LECmd.exe on a local disk"
      description: >-
        The shared-tools mount cannot be executed from (read-only Samba ACLs -> CreateProcess
        ERROR_ACCESS_DENIED); copy the binary to a local directory and run it from there.
      command: '$src = "{{ adare_project_shared_tools | win_path }}\LECmd.exe"; $dst = "{{ tool_dir | win_path }}\LECmd.exe"; Copy-Item $src $dst -Force; "staged=$(Test-Path $dst) bytes=$((Get-Item $dst).Length)"'
      shell: true
      timeout: 120

  - command:
      name: "Record LECmd version"
      description: "Capture the version banner so the run documents which parser produced Table 1"
      tool: LECmd.exe
      # Not `Tee-Object -FilePath`: on PowerShell 5.1 (what Win11 ships as powershell.exe)
      # Tee-Object writes UTF-16LE, which the test functions would read as mojibake.
      # WriteAllText gives UTF-8 without a BOM; echoing $banner afterwards is what feeds
      # the `capture:` below.
      # MEASURED (runs 01KYJB8R0B9CADF51T4Z1SCY2T / 01KYJBM7DA1P36AVB25T7N87KH): a BARE
      # `LECmd.exe` does not resolve in the guest. CommandAction's `tool:` field is
      # declarative provenance only -- it does not add the shared tools directory to PATH --
      # so every invocation must name the exe by absolute path. `Select-Object -First 3` also
      # captured nothing (it stops the upstream pipeline before a native exe flushes); hence
      # `2>&1` and no pre-truncation -- the assertions only need to FIND a version in the
      # file. MEASURED 2026-07-28: run with no arguments LECmd prints its banner plus the
      # usage screen (2406 bytes) to STDOUT and exits 0, so `$banner` is non-empty and
      # `LECmd version 2026.5.0` is on its first line -- provided the STAGED copy is used.
      command: '$banner = (& "{{ tool_dir | win_path }}\LECmd.exe" 2>&1 | Out-String); [IO.File]::WriteAllText("{{ out_dir | win_path }}\tool_version.txt", $banner); $banner'
      shell: true
      allow_failure: true
      timeout: 120
      capture:
        variable: lecmd_version
        source: stdout

  - test: lecmd_version_recorded
  - test: lecmd_version_matches_paper

  # --- L1 -------------------------------------------------------------------
  # allow_failure is set on every invocation so a non-zero exit still reaches the
  # assertions instead of aborting the run.
  #
  # Shape of every per-sample invocation, and why:
  #   * the STAGED exe is used (the share denies execution);
  #   * `--json <raw_json_dir>` with the directory emptied first, because LECmd has no
  #     --jsonf; the single auto-named `<timestamp>_LECmd_Output.json` is then renamed to
  #     the `lecmd_L<n>.json` the normalizer expects;
  #   * `$LASTEXITCODE` is read AFTER the Out-File pipeline (it survives it) and written
  #     with WriteAllText, i.e. UTF-8 without a BOM.
  - command:
      name: "LECmd on L1"
      tool: LECmd.exe
      command: '$raw = "{{ raw_json_dir | win_path }}"; Remove-Item "$raw\*" -Force -ErrorAction SilentlyContinue; & "{{ tool_dir | win_path }}\LECmd.exe" -f "{{ sample_dir | win_path }}\L1.lnk" --json $raw 2>&1 | Out-File -FilePath "{{ out_dir | win_path }}\lecmd_L1.log.txt" -Encoding ascii; [IO.File]::WriteAllText("{{ out_dir | win_path }}\rc_L1.txt", "$LASTEXITCODE"); $p = Get-ChildItem $raw -Filter "*_LECmd_Output.json" | Select-Object -First 1; if ($p) { Move-Item $p.FullName "{{ out_dir | win_path }}\lecmd_L1.json" -Force }'
      shell: true
      allow_failure: true
      timeout: 300

  - test: l1_output_exists
  - test: l1_exit_code_zero
  - test: l1_source_file
  - test: l1_local_path
  - test: l1_working_directory
  - test: l1_volume_label

  - pull:
      description: "Collect L1 artifacts on the host for the Table 1 normalizer"
      src:
        - "{{ out_dir }}/lecmd_L1.json"
        - "{{ out_dir }}/lecmd_L1.log.txt"
        - "{{ out_dir }}/rc_L1.txt"
        - "{{ out_dir }}/tool_version.txt"

  # --- L2 -------------------------------------------------------------------
  - command:
      name: "LECmd on L2"
      tool: LECmd.exe
      command: '$raw = "{{ raw_json_dir | win_path }}"; Remove-Item "$raw\*" -Force -ErrorAction SilentlyContinue; & "{{ tool_dir | win_path }}\LECmd.exe" -f "{{ sample_dir | win_path }}\L2.lnk" --json $raw 2>&1 | Out-File -FilePath "{{ out_dir | win_path }}\lecmd_L2.log.txt" -Encoding ascii; [IO.File]::WriteAllText("{{ out_dir | win_path }}\rc_L2.txt", "$LASTEXITCODE"); $p = Get-ChildItem $raw -Filter "*_LECmd_Output.json" | Select-Object -First 1; if ($p) { Move-Item $p.FullName "{{ out_dir | win_path }}\lecmd_L2.json" -Force }'
      shell: true
      allow_failure: true
      timeout: 300

  - test: l2_output_exists
  - test: l2_exit_code_zero
  - test: l2_local_path
  - test: l2_working_directory

  - pull:
      description: "Collect L2 artifacts on the host"
      src:
        - "{{ out_dir }}/lecmd_L2.json"
        - "{{ out_dir }}/lecmd_L2.log.txt"
        - "{{ out_dir }}/rc_L2.txt"

  # --- L3 -------------------------------------------------------------------
  - command:
      name: "LECmd on L3"
      tool: LECmd.exe
      command: '$raw = "{{ raw_json_dir | win_path }}"; Remove-Item "$raw\*" -Force -ErrorAction SilentlyContinue; & "{{ tool_dir | win_path }}\LECmd.exe" -f "{{ sample_dir | win_path }}\L3.lnk" --json $raw 2>&1 | Out-File -FilePath "{{ out_dir | win_path }}\lecmd_L3.log.txt" -Encoding ascii; [IO.File]::WriteAllText("{{ out_dir | win_path }}\rc_L3.txt", "$LASTEXITCODE"); $p = Get-ChildItem $raw -Filter "*_LECmd_Output.json" | Select-Object -First 1; if ($p) { Move-Item $p.FullName "{{ out_dir | win_path }}\lecmd_L3.json" -Force }'
      shell: true
      allow_failure: true
      timeout: 300

  - test: l3_output_exists
  - test: l3_exit_code_zero
  - test: l3_local_path
  - test: l3_working_directory

  - pull:
      description: "Collect L3 artifacts on the host"
      src:
        - "{{ out_dir }}/lecmd_L3.json"
        - "{{ out_dir }}/lecmd_L3.log.txt"
        - "{{ out_dir }}/rc_L3.txt"

  # --- leave the guest as we found it ---------------------------------------
  # Everything the assertions needed is already on the host. Remove the staged binary and
  # the LECmd scratch directory so the guest image does not accumulate a copy of a
  # third-party parser run after run; forensic integrity of the image depends on it.
  - command:
      name: "Remove the staged binary and JSON scratch directory"
      command: 'Remove-Item -Recurse -Force "{{ tool_dir | win_path }}","{{ raw_json_dir | win_path }}" -ErrorAction SilentlyContinue; "tool_dir_gone=$(-not (Test-Path "{{ tool_dir | win_path }}")) raw_gone=$(-not (Test-Path "{{ raw_json_dir | win_path }}"))"'
      shell: true
      allow_failure: true
      timeout: 120
