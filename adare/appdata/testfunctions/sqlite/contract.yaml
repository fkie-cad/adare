# Contract of the sqlite collection: what each function can and cannot do, and runnable
# examples. Schema and rendering: adare/adare/backend/testfunction/contract.py. The examples run
# in the unit suite (test_contract_examples.py); `adare test info sqlite.<name>` shows all of it.

collection:
  title: SQLite
  summary: >-
    SQL queries on SQLite databases and the write-ahead log (``-wal``) next to them: the rows a
    query returns, how many there are, which rows live only in the WAL, the state after each
    transaction in the WAL, two query values compared with each other (also across databases),
    how many frames and transactions the WAL holds, and deleted data left in the free space of
    the database file. The original files are never opened by SQLite: the database and
    its ``-wal`` / ``-journal`` are copied once and the copy is queried, so uncheckpointed changes
    are seen, the evidence is not modified and every result names the SHA-256 of the bytes read.

# Anchors for the example files (not read by the parser).
fixtures:
  # a plain (rollback-journal) database: items 1 example, 2 other
  items: &items
    sqlite:
      - CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT)
      - INSERT INTO items VALUES (1, 'example'), (2, 'other')
  # visits with a Unix time in seconds (2026-01-01T11:00:00Z)
  visits: &visits
    sqlite:
      - CREATE TABLE visits (url TEXT, visited INTEGER)
      - INSERT INTO visits VALUES ('https://example.org/', 1767265200)
  # A WAL-mode database copied while the writer was open (page size 512). The main file holds
  # items (1, 'kept') and (2, 'removed-entry'); the -wal commits two transactions after a reset:
  # insert (3, 'example'), delete id 2. 11 frames: 2 valid (both commits), 9 stale from before
  # the reset. Made with Python's sqlite3: PRAGMA page_size=512, journal_mode=WAL,
  # wal_autocheckpoint=0; create + insert 1, 2; four insert/delete transactions; PRAGMA
  # wal_checkpoint(PASSIVE); insert 3; delete 2; both files copied before closing.
  wal_db: &wal_db
    fixture: sqlite_wal/app.db
  wal_log: &wal_log
    fixture: sqlite_wal/app.db-wal
  # notes: row 2 deleted with secure_delete off, so its bytes stay in the page's free space
  deleted_note: &deleted_note
    sqlite:
      - PRAGMA secure_delete = OFF
      - CREATE TABLE notes (id INTEGER PRIMARY KEY, title TEXT)
      - INSERT INTO notes VALUES (1, 'kept-note'), (2, 'deleted-note-title')
      - DELETE FROM notes WHERE id = 2
  # the same delete with secure_delete on: the freed bytes are zeroed
  erased_note: &erased_note
    sqlite:
      - PRAGMA secure_delete = ON
      - CREATE TABLE notes (id INTEGER PRIMARY KEY, title TEXT)
      - INSERT INTO notes VALUES (1, 'kept-note'), (2, 'deleted-note-title')
      - DELETE FROM notes WHERE id = 2
  # a document with two Unix times in seconds: created 2026-01-01T11:00:00Z, modified 90 s later
  documents: &documents
    sqlite:
      - CREATE TABLE documents (name TEXT, created INTEGER, modified INTEGER)
      - INSERT INTO documents VALUES ('report.txt', 1767265200, 1767265290)

functions:
  query_result:
    asserts: [exists, absent, value, count]
    formats: [sqlite]
    features: [archive_dst, glob_dst, sqlite_view, count_comparison, negative, placeholder, regex_tag, timestamp_tag]
    not_for:
      - goal: only how many rows a query returns
        use: sqlite.row_count
      - goal: how many frames or transactions the write-ahead log holds
        use: sqlite.wal_frame_count
      - goal: a value in deleted records or free pages that no query returns
        use: sqlite.free_space_pattern_count
      - goal: a query value compared with another query value, another view or another database
        use: sqlite.values_compare
    related:
      - use: sqlite.row_count
        why: the same query and views, but asserts the number of rows only
      - use: sqlite.wal_frame_count
        why: counts the frames and transactions of the WAL the views compare
    outcomes:
      passed: the query ran and its rows match ``expected_count`` and ``expected_result`` (with neither set, whenever the query runs)
      failed: the query ran and the number of rows or the rows themselves do not match
      error:
        - the database does not exist; a glob matches no file or more than one
        - an SQL error (syntax, unknown table or column, a corrupt or unreadable database), also on one side of a ``wal_added`` / ``wal_removed`` difference
        - the database files cannot be copied
        - a negative or non-integer ``expected_count``; an unknown ``comparison_type`` or ``view``
        - an invalid regex or an unknown placeholder in ``expected_result``
    limits:
      - '``expected_result`` is compared as a whole: every row, in query order, with every selected column. Add ``ORDER BY`` for a stable order.'
      - '``!re`` and ``!timestamp`` cells in ``expected_result`` are compared with the typed value of that cell, so an INTEGER column needs no ``CAST``: ``!timestamp`` with ``epoch`` / ``unit`` reads the number, ``!re`` matches its text (``str(value)``, the digits of an INTEGER). A NULL never matches a placeholder. The rest of the row (other columns, row count and order) must still equal the result.'
      - Differences (``wal_added`` / ``wal_removed``) compare whole rows; select identifying columns, a changed row appears in both.
      - '``dst`` inside an archive (``backup.zip!/app/data.db``) also extracts the ``-wal`` / ``-journal`` members next to it, so the views work there too.'
      - The rows read are reported in the details, cut after 2000 characters.
      - '``view`` is ``current``, ``main_file``, ``wal_added``, ``wal_removed`` or ``commit:N`` (the state after the N-th transaction in the ``-wal``; ``commit:-1`` the last, ``commit:0`` the main file). An N out of range is an error.'
    choices:
      comparison_type: [equals, greater, less, greater_equal, less_equal]
    use_cases:
      - title: A record was written
        text: A history entry, bookmark or setting row with the expected values after an action.
      - title: A record is gone
        text: '``expected_count: 0`` on a query for the deleted row.'
      - title: A change is still only in the write-ahead log
        text: '``view: wal_added`` shows rows committed to the ``-wal`` but not yet checkpointed into the main file; ``view: wal_removed`` rows deleted there that the main file still holds.'
      - title: A time stored as a number
        text: '``!timestamp`` with ``epoch`` / ``unit`` and the times saved around the action, directly on the INTEGER column (no ``CAST``).'
    examples:
      - title: a row with the expected values
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id, name FROM items WHERE name = 'example'
          expected_result: [{id: 1, name: example}]
      - title: no such row
        text: Absence of a row; a missing database would be an error, never this pass.
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'secret-project'
          expected_count: 0
      - title: other values fail
        expect: failed
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT name FROM items WHERE id = 2
          expected_result: [{name: example}]
      - title: an unknown table is an error, not a failure
        text: The query never ran, so nothing was learnt about the rows; ``expect_to_fail`` cannot turn it into a pass.
        expect: error
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM bookmarks
          expected_count: 0
      - title: a missing database is an error
        expect: error
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/other.db
          query: SELECT id FROM items
          expected_count: 0
      - title: a row only in the write-ahead log
        text: Committed to the ``-wal``, not yet checkpointed into the main file.
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id, name FROM items ORDER BY id
          expected_result: [{id: 3, name: example}]
          view: wal_added
      - title: a row deleted in the WAL but still in the main file
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id, name FROM items ORDER BY id
          expected_result: [{id: 2, name: removed-entry}]
          view: wal_removed
      - title: the current state includes the WAL
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id, name FROM items ORDER BY id
          expected_result: [{id: 1, name: kept}, {id: 3, name: example}]
      - title: visit time between two saved timestamps
        text: The INTEGER column is compared as the number it is; no ``CAST`` is needed.
        files:
          /home/user/app/data.db: *visits
        parameter:
          dst: /home/user/app/data.db
          query: SELECT visited FROM visits WHERE url = 'https://example.org/'
          expected_result:
            - visited: !timestamp {after: '{{before_visit}}', before: '{{after_visit}}', epoch: 1970, unit: s}
      - title: a visit time outside the saved interval fails
        text: The boundary of the previous example. The stored number is read, found before the lower bound, and the test fails.
        expect: failed
        files:
          /home/user/app/data.db: *visits
        parameter:
          dst: /home/user/app/data.db
          query: SELECT visited FROM visits WHERE url = 'https://example.org/'
          expected_result:
            - visited: !timestamp {after: '2026-01-01T12:00:00Z', before: '2026-01-01T12:00:10Z', epoch: 1970, unit: s}
      - title: a URL by pattern
        files:
          /home/user/app/data.db: *visits
        parameter:
          dst: /home/user/app/data.db
          query: SELECT url FROM visits
          expected_result: [{url: !re 'https://example\.org/.*'}]

  row_count:
    asserts: [count, exists, absent]
    formats: [sqlite]
    features: [archive_dst, glob_dst, sqlite_view, count_comparison, negative]
    not_for:
      - goal: the values of the rows
        use: sqlite.query_result
      - goal: how many frames or transactions the write-ahead log holds
        use: sqlite.wal_frame_count
      - goal: deleted rows still in the database file's free space
        use: sqlite.free_space_pattern_count
      - goal: the count in one view against the count in another (one row more in the WAL)
        use: sqlite.values_compare
    related:
      - use: sqlite.query_result
        why: the same query and views, and checks the returned rows themselves
    outcomes:
      passed: the number of rows the query returns satisfies ``comparison_type``
      failed: the query ran and the count comparison does not hold
      error:
        - the database does not exist; a glob matches no file or more than one
        - an SQL error (syntax, unknown table or column, a corrupt or unreadable database), also on one side of a difference; an empty ``query``
        - the database files cannot be copied
        - a negative or non-integer ``expected_count``; an unknown ``comparison_type`` or ``view``
    limits:
      - Every returned row counts, so ``SELECT COUNT(*)`` returns one row; select the rows themselves.
      - Differences (``wal_added`` / ``wal_removed``) compare whole rows; select identifying columns, a changed row appears in both.
      - '``dst`` inside an archive also extracts the ``-wal`` / ``-journal`` members next to it.'
      - '``view`` is ``current``, ``main_file``, ``wal_added``, ``wal_removed`` or ``commit:N`` (the state after the N-th transaction in the ``-wal``; ``commit:-1`` the last, ``commit:0`` the main file). An N out of range is an error.'
    choices:
      comparison_type: [equals, greater, less, greater_equal, less_equal]
    use_cases:
      - title: Record created exactly once
        text: An action must add one row (one history entry, one bookmark), not zero and not two.
      - title: Record removed
        text: '``expected_count: 0`` after a delete or "clear history" action.'
      - title: Row not yet checkpointed
        text: '``view: wal_added`` counts the rows that live only in the write-ahead log; ``view: wal_removed`` the rows deleted there that the main file still holds.'
      - title: Growth of a table
        text: '``comparison_type: greater_equal`` when an action may add a varying number of rows.'
    examples:
      - title: exactly one matching entry
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name LIKE '%example%'
          expected_count: 1
      - title: entry deleted
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'secret-project'
          expected_count: 0
      - title: COUNT(*) is one row
        text: The query returns one row holding 2; count the rows themselves (``SELECT id ...``).
        expect: failed
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT COUNT(*) FROM items
          expected_count: 2
      - title: the one database in a folder, whatever its name
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/*.db
          query: SELECT id FROM items
          expected_count: 1
          comparison_type: greater_equal
      - title: a glob matching two databases is an error
        expect: error
        files:
          /home/user/app/a.db: *items
          /home/user/app/b.db: *items
        parameter:
          dst: /home/user/app/*.db
          query: SELECT id FROM items
          expected_count: 2
      - title: entry not yet checkpointed
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'example'
          expected_count: 1
          view: wal_added
      - title: deleted entry still in the main file
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'removed-entry'
          expected_count: 1
          view: main_file
      - title: the deleted entry was still there after the first transaction
        text: '``commit:1`` replays the ``-wal`` through its first transaction (the insert), before the delete.'
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'removed-entry'
          expected_count: 1
          view: commit:1
      - title: a commit the WAL does not hold is an error
        expect: error
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items
          expected_count: 1
          view: commit:5
      - title: but gone in the current state
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'removed-entry'
          expected_count: 0
      - title: a database inside an archive, with its WAL
        text: The ``-wal`` member next to the database member is extracted with it.
        files:
          /home/user/backup/app.zip:
            zip:
              data.db: *wal_db
              data.db-wal: *wal_log
        parameter:
          dst: /home/user/backup/app.zip!/data.db
          query: SELECT id FROM items WHERE name = 'example'
          expected_count: 1
          view: wal_added

  wal_frame_count:
    asserts: [count, absent]
    formats: [sqlite]
    features: [archive_dst, glob_dst, count_comparison, negative]
    not_for:
      - goal: which rows live only in the WAL
        use: sqlite.row_count
      - goal: the values of rows in the WAL
        use: sqlite.query_result
      - goal: a value in stale WAL frames
        use: text.occurrence_count
    related:
      - use: sqlite.row_count
        why: '``view: wal_added`` / ``wal_removed`` show which rows the WAL adds or removes'
    outcomes:
      passed: the number of ``frames`` of the chosen kind satisfies ``comparison_type``; a missing ``-wal`` next to the database and an empty one have 0 frames
      failed: the WAL was read and the count comparison does not hold
      error:
        - the database does not exist, or ``dst`` names a ``-wal`` that does not exist; a glob matches no file or more than one
        - the WAL cannot be read
        - 'an invalid WAL header: shorter than 32 bytes, a wrong magic, a version other than 3007000, a bad page size, a header checksum mismatch'
        - a negative or non-integer ``expected_count``; an unknown ``comparison_type`` or ``frames``
    limits:
      - The WAL is parsed per the SQLite file format, without SQLite; a copy is read and its SHA-256 reported.
      - Counts frames, not rows; one transaction may write several frames, one per changed page.
      - '``dst`` inside an archive reads the ``-wal`` member next to the database member (or names the ``-wal`` member itself).'
    choices:
      comparison_type: [equals, greater, less, greater_equal, less_equal]
      frames: [valid, commits, all, stale]
    use_cases:
      - title: Changes not yet checkpointed
        text: '``frames: commits`` with ``comparison_type: greater_equal`` after an action, while the application still holds the database open.'
      - title: Checkpoint ran
        text: '``expected_count: 0`` after the application closed: the WAL was checkpointed and truncated or deleted.'
      - title: Leftovers of earlier transactions
        text: '``frames: stale`` greater than 0: frames from before a WAL reset that SQLite no longer reads, whose pages may still hold earlier content.'
    examples:
      - title: transactions not yet checkpointed
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          expected_count: 1
          comparison_type: greater_equal
          frames: commits
      - title: old frames after a WAL reset
        text: '``dst`` may name the ``-wal`` itself.'
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db-wal
          expected_count: 1
          comparison_type: greater_equal
          frames: stale
      - title: a WAL that still holds frames fails a checkpoint check
        expect: failed
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          expected_count: 0
      - title: no -wal next to the database is 0 frames
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          expected_count: 0
      - title: a named -wal that does not exist is an error
        expect: error
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db-wal
          expected_count: 0
      - title: a WAL with a wrong magic is an error
        expect: error
        files:
          /home/user/app/data.db: *items
          /home/user/app/data.db-wal:
            hex: 00000000 002de218 00000200 00000000 00000000 00000000 00000000 00000000
        parameter:
          dst: /home/user/app/data.db
          expected_count: 0

  values_compare:
    asserts: [compare, order]
    formats: [sqlite]
    features: [archive_dst, glob_dst, sqlite_view, ordered_comparison, other_dst]
    not_for:
      - goal: one query value against a constant
        use: sqlite.query_result
      - goal: how many rows a query returns
        use: sqlite.row_count
    related:
      - use: sqlite.query_result
        why: the same snapshot and views, for the rows themselves
      - use: sqlite.wal_frame_count
        why: how many transactions ``commit:N`` can choose from
    outcomes:
      passed: 'the value ``query`` returns relates to the value ``other_query`` returns, plus ``offset``, as ``comparison_type`` says'
      failed:
        - a query returns no row
        - the queries ran and the comparison does not hold
      error:
        - a database does not exist; a glob matches no file or more than one
        - a query returns more than one row; an SQL error; an empty ``query``
        - a value that is no number or timestamp (NULL, a BLOB, text that is no time)
        - an unknown ``view``, or ``commit:N`` out of range
        - bad comparison parameters (``comparison_type``, ``value_type``, ``timestamp_epoch``, ...)
    limits:
      - Each side is the first column of the single row its query returns. ``other_query`` defaults to ``query``, ``other_view`` to ``view``, ``other_dst`` to ``dst``.
      - With one database both sides come from one snapshot, so they show the same moment; ``other_dst`` gets its own snapshot.
      - '``offset`` is added to the second value (seconds for timestamps): ``first <comparison_type> second + offset``.'
      - '``view`` and ``other_view`` are ``current``, ``main_file`` or ``commit:N``; the differences ``wal_added`` / ``wal_removed`` are not values.'
      - Two text values cannot be compared; numbers and times only.
    choices:
      comparison_type: [equals, not_equals, greater, less, greater_equal, less_equal]
      value_type: [auto, number, timestamp]
    use_cases:
      - title: The WAL adds exactly one row
        text: '``SELECT count(*)`` on ``view: current`` equal to ``other_view: main_file`` with ``offset: 1``, in one check.'
      - title: How a value changed between two transactions
        text: '``view: commit:2`` against ``other_view: commit:1``.'
      - title: Two times of one record in order
        text: A modification time after the creation time, with ``other_query`` on the other column.
      - title: Before and after an action
        text: '``other_dst`` on a copy of the database a ``command`` action made before the action under test.'
    examples:
      - title: the WAL adds exactly one matching row
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT count(*) FROM items WHERE name = 'example'
          view: current
          other_view: main_file
          offset: 1
      - title: fewer rows after the second transaction than after the first
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT count(*) FROM items
          view: commit:1
          other_view: commit:2
          comparison_type: greater
      - title: modified after created, as times
        files:
          /home/user/docs/index.db: *documents
        parameter:
          dst: /home/user/docs/index.db
          query: SELECT modified FROM documents WHERE name = 'report.txt'
          other_query: SELECT created FROM documents WHERE name = 'report.txt'
          comparison_type: greater
          value_type: timestamp
          timestamp_epoch: 1970
      - title: within two minutes of each other
        files:
          /home/user/docs/index.db: *documents
        parameter:
          dst: /home/user/docs/index.db
          query: SELECT modified FROM documents
          other_query: SELECT created FROM documents
          value_type: timestamp
          timestamp_epoch: 1970
          tolerance: 120
      - title: against a copy made before the action
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
          /tmp/before/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT max(id) FROM items
          other_dst: /tmp/before/data.db
          comparison_type: greater
      - title: equal counts fail when the WAL added a row
        expect: failed
        files:
          /home/user/app/data.db: *wal_db
          /home/user/app/data.db-wal: *wal_log
        parameter:
          dst: /home/user/app/data.db
          query: SELECT count(*) FROM items WHERE name = 'example'
          other_view: main_file
      - title: no row fails
        expect: failed
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items WHERE name = 'missing'
          other_query: SELECT id FROM items WHERE name = 'example'
      - title: several rows are an error
        text: Each query must return exactly one row; aggregate (``count(*)``, ``max(...)``) or add a ``WHERE``.
        expect: error
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT id FROM items
      - title: a text value is an error
        expect: error
        files:
          /home/user/app/data.db: *items
        parameter:
          dst: /home/user/app/data.db
          query: SELECT name FROM items WHERE id = 1

  free_space_pattern_count:
    asserts: [count, absent, content]
    formats: [sqlite]
    features: [archive_dst, glob_dst, count_comparison, encoding, negative]
    unsupported:
      regex_tag: 'A ``!re`` or ``!timestamp`` pattern is an error; use ``pattern_type: regex`` with a plain string.'
      sqlite_view: '``view`` is ``main_file`` or ``current`` (the ``-wal`` checkpointed into a copy) only; no ``wal_added`` / ``wal_removed`` / ``commit:N``.'
    not_for:
      - goal: whether a query still returns the row
        use: sqlite.row_count
      - goal: a pattern anywhere in the file, live rows included
        use: binary.pattern_count
      - goal: content of stale frames in the write-ahead log
        use: text.occurrence_count
    related:
      - use: sqlite.row_count
        why: '``expected_count: 0`` that the row is gone, next to this test that its bytes remain'
    outcomes:
      passed: the occurrences of ``pattern`` in the chosen free space satisfy ``comparison_type``
      failed: the file was parsed and the count comparison does not hold
      error:
        - the database does not exist; a glob matches no file or more than one
        - the database files cannot be copied or read
        - 'a corrupt header, or a broken freelist or freeblock chain (a pointer out of range, a cycle, a freelist count that does not match the header): the free space could not be located'
        - '``view: current`` and SQLite cannot checkpoint the copy'
        - an empty ``pattern``; invalid escapes, hex or regex; a ``!re`` / ``!timestamp`` pattern
        - an unknown ``region``, ``view``, ``pattern_type`` or ``encoding``; a negative or non-integer ``expected_count``; an unknown ``comparison_type``
    limits:
      - 'The file is parsed per the SQLite file format, without SQLite: freelist pages (with the overflow pages of a deleted large row), freeblocks inside b-tree pages, and the unallocated space of each b-tree page. Live rows are never counted.'
      - Occurrences are counted per region, so a match never spans two regions. The details list the matching pages and regions (absolute file offsets) and the size of each kind of free space.
      - Freeing a cell overwrites its first 4 bytes (the freeblock header), and later writes reuse free space; search for a part of the deleted value that is long enough to be unique.
      - '``PRAGMA secure_delete`` (on in some builds) zeroes freed space, so ``expected_count: 0`` proves the delete erased it.'
      - '``pattern_type: regex`` is an ASCII regular expression over the raw bytes; empty matches are not counted.'
    choices:
      pattern_type: [text, bytes, hex, regex]
      region: [all, freelist, freeblocks, unallocated]
      view: [main_file, current]
      comparison_type: [equals, greater, less, greater_equal, less_equal]
    use_cases:
      - title: A deleted record is still recoverable
        text: '``comparison_type: greater_equal`` with ``expected_count: 1`` in the free space, while sqlite.row_count no longer returns the row.'
      - title: A delete erased the data
        text: '``expected_count: 0``, as with ``PRAGMA secure_delete`` or after a ``VACUUM``.'
    examples:
      - title: a deleted title is still in the free space
        files:
          /home/user/app/notes.db: *deleted_note
        parameter:
          dst: /home/user/app/notes.db
          pattern: deleted-note-title
          expected_count: 1
          comparison_type: greater_equal
      - title: a live row is not free space
        files:
          /home/user/app/notes.db: *deleted_note
        parameter:
          dst: /home/user/app/notes.db
          pattern: kept-note
          expected_count: 0
      - title: a regex over the raw bytes
        files:
          /home/user/app/notes.db: *deleted_note
        parameter:
          dst: /home/user/app/notes.db
          pattern: 'deleted-[a-z]+-title'
          pattern_type: regex
          expected_count: 1
          comparison_type: greater_equal
      - title: secure_delete erased it
        files:
          /home/user/app/notes.db: *erased_note
        parameter:
          dst: /home/user/app/notes.db
          pattern: deleted-note-title
          expected_count: 0
      - title: recoverable data fails an erase check
        expect: failed
        files:
          /home/user/app/notes.db: *deleted_note
        parameter:
          dst: /home/user/app/notes.db
          pattern: deleted-note-title
          expected_count: 0
      - title: an empty pattern is an error
        expect: error
        files:
          /home/user/app/notes.db: *deleted_note
        parameter:
          dst: /home/user/app/notes.db
          pattern: ''
      - title: a file that is no database is an error
        expect: error
        files:
          /home/user/app/notes.db:
            text: not an sqlite database
        parameter:
          dst: /home/user/app/notes.db
          pattern: deleted-note-title
