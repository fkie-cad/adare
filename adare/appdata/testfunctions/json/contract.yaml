# Contract of the json collection: what each function can and cannot do, and runnable
# examples. Schema and rendering: adare/adare/backend/testfunction/contract.py. The examples run
# in the unit suite (test_contract_examples.py); `adare test info json.<name>` shows all of it.

collection:
  title: JSON
  summary: >-
    JSON documents such as settings files, session stores and exported records. The functions
    check that a key path exists, what its value is (also as a number or point in time), whether
    an array holds an element, how many values a path selects (``0`` = absent) and how two values
    of one file relate. Files are decoded as UTF-8/16/32 with or without BOM, or in a given
    ``encoding``; LZ4-compressed stores are read through ``store.jsonlz4!``.

# Anchors for the example files (not read by the parser).
fixtures:
  # A settings file: nested objects, an array of objects, a string array, a null value,
  # millisecond Unix times (opened 2026-01-01T10:00:00Z, lastSaved 11:00:00Z) and a key with a dot.
  settings: &settings
    json:
      display: {fontSize: 14, theme: dark}
      window: {opened: 1767261600000, lastSaved: 1767265200000, width: 1280}
      groups:
        - name: work
          items:
            - {title: Example Entry, tag: archived}
            - {title: Notes, tag: active}
        - name: home
          items:
            - {title: Recipes, tag: archived}
      recent_files: [/home/user/Documents/report.odt, /home/user/Documents/plan.odt]
      sync: null
      counters: {last: 41, next: 42}
      app.window: {width: 800}
  # An LZ4 store as some applications write it: 8-byte magic, u32le size of the JSON, then one
  # LZ4 block made of literals only (token 0xF0 + extra length byte = 15 + 22 = 37 bytes).
  store: &store
    concat:
      - text: "mozLz40\0"
      - u32le: 37
      - u8: 240
      - u8: 22
      - text: '[{"tag":"a"},{"tag":"b"},{"tag":"a"}]'
  # Not valid JSON.
  broken: &broken
    text: '{"display": {"fontSize": 14,'

functions:
  contains_key:
    asserts: [exists]
    formats: [json]
    features: [archive_dst, glob_dst, key_path, encoding]
    not_for:
      - goal: the value of a key
        use: json.value_matches
      - goal: a key or value is absent
        use: json.value_count
      - goal: a list holds an entry
        use: json.array_contains
    outcomes:
      passed: '``key_path`` selects at least one value (a ``null`` value counts)'
      failed: the file was read and ``key_path`` selects nothing
      error:
        - the file does not exist or is a directory; a glob matches no file or more than one
        - the file is not valid JSON or cannot be decoded; an unknown ``encoding``
    limits:
      - 'With ``expect_to_fail: true`` a missing key passes, but a missing file stays an error; json.value_count with ``expected_count: 0`` says the same more clearly.'
    use_cases:
      - title: A setting was written
        text: A settings or configuration file gained a key after an action, whatever its value.
    examples:
      - title: nested key exists
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.fontSize
      - title: a null value counts as present
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: sync
      - title: a key that contains a dot
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: "['app.window'].width"
      - title: an absent key fails
        text: To assert absence use json.value_count with ``expected_count`` 0, which passes.
        expect: failed
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.language
      - title: invalid JSON is an error, not a failure
        expect: error
        files:
          /home/user/data/settings.json: *broken
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.fontSize

  value_matches:
    asserts: [value, order]
    formats: [json]
    features: [archive_dst, glob_dst, key_path, wildcard_mode, regex_tag, placeholder, timestamp_tag, ordered_comparison, encoding]
    not_for:
      - goal: no value matches, a key is absent
        use: json.value_count
      - goal: two values of one file relate (earlier, within seconds, one above)
        use: json.values_compare
      - goal: a list holds a whole object or a value as one element
        use: json.array_contains
      - goal: one field in any line of a JSON Lines log
        use: jsonl.value_in_any_line
    outcomes:
      passed: 'the value at ``key_path`` (``any``: one of the values, ``all``: every value) matches ``expected_value``'
      failed: the file was read and ``key_path`` selects nothing, or the value(s) do not match
      error:
        - the file does not exist or is a directory; a glob matches no file or more than one
        - the file is not valid JSON or cannot be decoded; an unknown ``encoding``
        - an invalid ``wildcard_mode``; an invalid regex or unknown placeholder
        - in ordered mode, a ``!re`` tag, placeholder or ``regex_match``, bad ordered parameters, or a value that is no number or timestamp
    limits:
      - 'Equality is Python ``==`` and type-sensitive (``5`` is not ``"5"``; a JSON ``null`` needs ``expected_value: null``).'
      - A path that selects an array compares its elements one by one (a one-element array is unwrapped); a whole array cannot be compared.
      - '``regex_match`` searches (``re.search``, unanchored); a ``!re`` tag matches from the start (``re.match``).'
    choices:
      wildcard_mode: [any, all]
      comparison_type: [equals, not_equals, greater, less, greater_equal, less_equal]
      value_type: [auto, number, timestamp]
      timestamp_epoch: [1970, 1601, 2001]
      timestamp_unit: [s, ms, us, ns, 100ns]
    use_cases:
      - title: A setting has a value
        text: A setting changed in the GUI is stored in a JSON settings file.
      - title: Every entry of a list has a property
        text: '``list[*].field`` with ``wildcard_mode: all``.'
      - title: A number or time above or below a threshold
        text: '``comparison_type: greater`` with the time parameters for times stored as numbers.'
    examples:
      - title: a setting has a value
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.theme
          expected_value: dark
      - title: one entry in nested arrays has a title
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: groups[*].items[*].title
          expected_value: Example Entry
      - title: not every entry is archived
        text: '``wildcard_mode: all`` needs every selected value to match.'
        expect: failed
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: groups[*].items[*].tag
          expected_value: archived
          wildcard_mode: all
      - title: equality is type-sensitive
        text: The file holds the number 14; the string ``"14"`` does not match.
        expect: failed
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.fontSize
          expected_value: '14'
      - title: saved after a point in time
        text: The value counts milliseconds since 1970.
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: window.lastSaved
          expected_value: '2026-01-01T10:30:00Z'
          comparison_type: greater
          timestamp_epoch: 1970
          timestamp_unit: ms
      - title: a regex on every recent file
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: recent_files
          expected_value: '\.odt$'
          regex_match: true
          wildcard_mode: all
      - title: a time within the interval of an action
        text: The times saved around the action bound the stored value.
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: window.lastSaved
          expected_value: !timestamp {after: '{{before_save}}', before: '{{after_save}}', epoch: 1970, unit: ms}
      - title: an ordered comparison of text is an error
        text: The test looked at the wrong field; it cannot fail.
        expect: error
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.theme
          expected_value: 5
          comparison_type: greater
      - title: a glob with several matches is an error
        expect: error
        files:
          /home/user/data/profile-a.json: *settings
          /home/user/data/profile-b.json: *settings
        parameter:
          dst: /home/user/data/profile-*.json
          key_path: display.theme
          expected_value: dark
      - title: an invalid regex is an error
        expect: error
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.theme
          expected_value: '[unclosed'
          regex_match: true

  array_contains:
    asserts: [value]
    formats: [json]
    features: [archive_dst, glob_dst, key_path, regex_tag, placeholder, timestamp_tag, encoding]
    not_for:
      - goal: an element whose one field has a value (objects compare whole)
        use: json.value_matches
      - goal: how many elements, or an element is gone
        use: json.value_count
    outcomes:
      passed: the array at ``array_path`` has an element equal to (or matching) ``expected_value``
      failed: the file was read and the path does not exist, is no array, or no element matches
      error:
        - the file does not exist or is a directory; a glob matches no file or more than one
        - the file is not valid JSON or cannot be decoded; an unknown ``encoding``
        - an invalid ``!re`` or unknown placeholder in ``expected_value``
    limits:
      - Elements compare with type-sensitive ``==``; objects and arrays must be equal as a whole.
      - A wildcard path that selects several values is treated as the array of those values.
      - There is no ``regex_match``; use a ``!re`` tag, which matches the ``str()`` of each element.
    use_cases:
      - title: A list in a settings file gained an entry
        text: Recent files, allowed origins or enabled extensions.
      - title: A whole record in a list
        text: 'An object such as ``{action: read, resource: users}`` as one element.'
    examples:
      - title: recent files include a document
        files:
          /home/user/.config/app/settings.json: *settings
        parameter:
          dst: /home/user/.config/app/settings.json
          array_path: recent_files
          expected_value: /home/user/Documents/report.odt
      - title: a whole object as element
        files:
          /home/user/.config/app/settings.json: *settings
        parameter:
          dst: /home/user/.config/app/settings.json
          array_path: groups[0].items
          expected_value: {title: Notes, tag: active}
      - title: a wildcard path forms the array
        files:
          /home/user/.config/app/settings.json: *settings
        parameter:
          dst: /home/user/.config/app/settings.json
          array_path: groups[*].name
          expected_value: home
      - title: a partial object does not match
        text: Objects compare whole; for one field use json.value_matches with ``groups[0].items[*].title``.
        expect: failed
        files:
          /home/user/.config/app/settings.json: *settings
        parameter:
          dst: /home/user/.config/app/settings.json
          array_path: groups[0].items
          expected_value: {title: Notes}
      - title: a value that is no array fails
        expect: failed
        files:
          /home/user/.config/app/settings.json: *settings
        parameter:
          dst: /home/user/.config/app/settings.json
          array_path: display.theme
          expected_value: dark

  value_count:
    asserts: [count, absent]
    formats: [json]
    features: [archive_dst, glob_dst, key_path, count_comparison, negative, regex_tag, placeholder, timestamp_tag, encoding]
    not_for:
      - goal: what one value is
        use: json.value_matches
      - goal: records in a JSON Lines file
        use: jsonl.line_count
    outcomes:
      passed: the number of values at ``key_path`` (only those matching ``expected_value``, if given) satisfies ``comparison_type``
      failed: the file was read and the count comparison does not hold
      error:
        - the file does not exist or is a directory; a glob matches no file or more than one
        - the file is not valid JSON or cannot be decoded; an unknown ``encoding``
        - a negative or non-integer ``expected_count``; an unknown ``comparison_type``
        - an invalid regex or unknown placeholder
    limits:
      - Without ``expected_value`` every selected value counts once (``null`` too; an array is one value, ``list[*]`` counts its elements).
      - With ``expected_value`` a path that selects exactly one array counts its matching elements.
    choices:
      comparison_type: [equals, greater, less, greater_equal, less_equal]
    use_cases:
      - title: A key or value is absent
        text: '``expected_count: 0``: the key path selects nothing, or no value matches ``expected_value``.'
      - title: How many entries a list holds
        text: Exactly three bookmarks, at least one entry with a URL.
    examples:
      - title: two archived entries
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: groups[*].items[*].tag
          expected_value: archived
          expected_count: 2
      - title: an entry was removed
        text: No title matches, so the count is 0 and the test passes.
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: groups[*].items[*].title
          expected_value: Shopping
          expected_count: 0
      - title: a key is absent
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: display.language
          expected_count: 0
      - title: at least one recent file
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/settings.json
          key_path: recent_files[*]
          expected_count: 1
          comparison_type: greater_equal
      - title: tags in an LZ4-compressed store
        text: '``store.jsonlz4!`` reads the decompressed JSON; ``[*]`` addresses the top-level array.'
        files:
          /home/user/data/store.jsonlz4: *store
        parameter:
          dst: /home/user/data/store.jsonlz4!
          key_path: '[*].tag'
          expected_value: a
          expected_count: 2
      - title: a missing file is an error, never a pass
        text: '``expected_count: 0`` proves absence only in a file that was read.'
        expect: error
        files:
          /home/user/data/settings.json: *settings
        parameter:
          dst: /home/user/data/other.json
          key_path: display.language
          expected_count: 0

  values_compare:
    asserts: [order, compare]
    formats: [json]
    features: [archive_dst, glob_dst, key_path, ordered_comparison, encoding]
    not_for:
      - goal: one value against a constant
        use: json.value_matches
      - goal: two text values are equal
        use: json.value_matches
    outcomes:
      passed: '``first <comparison_type> second + offset`` holds'
      failed: the file was read and a side selects nothing, or the comparison does not hold
      error:
        - the file does not exist or is a directory; a glob matches no file or more than one
        - the file is not valid JSON or cannot be decoded; an unknown ``encoding``
        - a side selects several values
        - a value that is no number or timestamp, or a number compared with a timestamp
        - invalid parameters (``comparison_type``, ``value_type``, ``tolerance`` with an order comparison, ``timestamp_epoch``, ...)
    limits:
      - Each side must select exactly one value (a one-element array counts as its element).
      - Numbers and times only; two text values cannot be compared.
    choices:
      comparison_type: [equals, not_equals, greater, less, greater_equal, less_equal]
      value_type: [auto, number, timestamp]
      timestamp_epoch: [1970, 1601, 2001]
      timestamp_unit: [s, ms, us, ns, 100ns]
    use_cases:
      - title: A is earlier than B
        text: A last-saved value later than the first-opened one, an end after a start (``comparison_type`` ``less`` / ``greater``).
      - title: A within a few seconds of B
        text: 'Two timestamps written by one action (``tolerance: 5``).'
      - title: A = B + n
        text: 'A counter one above another (``offset: 1``), or a time a fixed interval after another (``offset`` in seconds).'
    examples:
      - title: saved after opened
        files:
          /home/user/data/session.json: *settings
        parameter:
          dst: /home/user/data/session.json
          key_path: window.lastSaved
          other_key_path: window.opened
          comparison_type: greater
          timestamp_epoch: 1970
          timestamp_unit: ms
      - title: saved one hour after opened
        files:
          /home/user/data/session.json: *settings
        parameter:
          dst: /home/user/data/session.json
          key_path: window.lastSaved
          other_key_path: window.opened
          offset: 3600
          timestamp_epoch: 1970
          timestamp_unit: ms
      - title: a counter one above another
        files:
          /home/user/data/session.json: *settings
        parameter:
          dst: /home/user/data/session.json
          key_path: counters.next
          other_key_path: counters.last
          offset: 1
      - title: a side that selects nothing fails
        expect: failed
        files:
          /home/user/data/session.json: *settings
        parameter:
          dst: /home/user/data/session.json
          key_path: window.closed
          other_key_path: window.opened
          comparison_type: greater
      - title: a side with several values is an error
        expect: error
        files:
          /home/user/data/session.json: *settings
        parameter:
          dst: /home/user/data/session.json
          key_path: groups[*].name
          other_key_path: window.opened
