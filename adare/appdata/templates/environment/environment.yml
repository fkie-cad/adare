# name: {{ environment }}  # Optional: filename is used as environment name
vm: {% if vm_name %}"{{ vm_name }}"{% else %}"path/to/your/vm"{% endif %}
os:
  os: "Windows 10"
  platform: "windows"
  distribution: "Home"
  version: "21H1"
  language: "English"

# Optional: Override hypervisor-specific settings
# hypervisor: qemu  # Default is virtualbox, but use qemu for UEFI/BIOS control
# hypervisor_config:
#   boot_mode: auto  # Options: 'auto' (arch-aware: x86_64 Linux->BIOS, Windows/ARM->UEFI), 'uefi', 'bios'

