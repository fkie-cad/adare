# name: {{ environment }}  # Optional: filename is used as environment name
vm: {% if vm_name %}"{{ vm_name }}"{% else %}"path/to/your/vm"{% endif %}
os:
  os: "Windows 10"
  platform: "windows"
  distribution: "Home"
  version: "21H1"
  language: "English"

# Optional: Override hypervisor-specific settings
# hypervisor: qemu  # Default: virtualbox for .ova/.vdi/.vmdk disks, qemu otherwise
# hypervisor_config:
#   boot_mode: auto  # Options: 'auto' (arch-aware: x86_64 Linux->BIOS, Windows/ARM->UEFI), 'uefi', 'bios'

# Commands run in the guest before every experiment run, in file order.
# Per step: name, command (required); description, cwd, shell (optional) and
#   admin: true          run as root / elevated instead of as the VM user (default: false)
#   allow_failure: true  a failing step only warns, the run continues (default: false)
#   timeout: 900         seconds the step may run (default: 600)
# Unknown keys are a load error. Output of every step: <run>/logs/postsetup.log
