name: ubuntu1804
display_name: "Ubuntu 18.04 LTS (Bionic Beaver) Desktop"
platform: linux
distribution: ubuntu
distribution_label: "Bionic Beaver"
version: "18.04"
architecture: x86_64
# Deterministic replay of the graphical ubiquity installer: a hand-calibrated QMP
# playbook (templates/qmpinstall_ubuntu1804.yaml) is replayed step by step, with
# `wait_stable` frame-diffing instead of image recognition. No vision model and no
# CV server, so this needs no ADARE_VLLM_* configuration. `install_mode: gui-auto`
# remains the way to *record* a new playbook for a release we have no coords for.
install_mode: gui-script
installer: gui
# 18.04 is EOL, so the desktop ISO lives on old-releases. The hash is the vendor
# SHA256SUMS entry (verified 2026-07-25); a mismatch re-downloads rather than
# installing a wrong image.
iso_url: "http://old-releases.ubuntu.com/releases/18.04/ubuntu-18.04.5-desktop-amd64.iso"
iso_sha256: "f295570badb09a606d97ddfc3421d7bf210b4a81c07ba81e9c040eda6ddea6a0"
iso_filename: "ubuntu-18.04.5-desktop-amd64.iso"
default_disk_size: "60G"
default_ram_mb: 4096
default_cpus: 0
# BIOS, not UEFI: the playbook's coordinates were calibrated on a SeaBIOS boot
# (`firmware: bios` in qmpinstall_ubuntu1804.yaml). Switching to OVMF changes the
# boot path and the early screens the replay counts on.
requires_uefi: false
# Force a dedicated playbook (qmpinstall_ubuntu1804.yaml) — 18.04's and 20.04's
# ubiquity differ visually, so they must not share a recording.
template: ubuntu1804
# UNTESTED ON THIS HOST: x86_64 guests cannot be built on Apple Silicon (no TCG
# fallback). The playbook itself was validated on an x86_64 host.
