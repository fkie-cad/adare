name: ubuntu1804
display_name: "Ubuntu 18.04 LTS (Bionic Beaver) Desktop"
platform: linux
distribution: ubuntu
distribution_label: "Bionic Beaver"
version: "18.04"
# GUI-automated install of the genuine desktop edition: the vision agent drives
# the graphical ubiquity installer and records a replayable playbook.
install_mode: gui-auto
installer: gui
# 18.04 is EOL; the desktop ISO lives on old-releases and must be supplied with
# --iso (gui-auto does not auto-download).
#   http://old-releases.ubuntu.com/releases/18.04/ubuntu-18.04.5-desktop-amd64.iso
#   sha256: f295570badb09a606d97ddfc3421d7bf210b4a81c07ba81e9c040eda6ddea6a0
iso_url: ""
iso_sha256: ""
iso_filename: ""
default_disk_size: "60G"
default_ram_mb: 4096
default_cpus: 0
requires_uefi: true
# Force a dedicated goal/spec + playbook (gui_ubuntu1804.*).
template: ubuntu1804
