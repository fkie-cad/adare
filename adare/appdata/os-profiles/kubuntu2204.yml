name: kubuntu2204
display_name: "Kubuntu 22.04 LTS (Jammy Jellyfish)"
platform: linux
distribution: ubuntu
distribution_label: "Jammy Jellyfish"
version: "22.04"
architecture: x86_64
requires_uefi: true
# Installed from the Kubuntu 22.04 ISO, which still runs ubiquity (Calamares only
# arrives with Kubuntu 23.04). ubiquity has no OEMDRV-style seed auto-detect, so
# `seed_transport: http` serves the rendered preseed from the host and casper's
# network-preseed fetches it from the url= spliced into the kernel cmdline.
install_mode: auto
installer: ubiquity
seed_transport: http
kernel_path_in_iso: /casper/vmlinuz
initrd_path_in_iso: /casper/initrd
kernel_cmdline: >-
  automatic-ubiquity noprompt boot=casper console={console} ---
# UNTESTED: x86_64 guests cannot be built on an Apple Silicon host (no TCG
# fallback). Shipped for replication on Intel/AMD hosts.
iso_url: ""
iso_sha256: ""
iso_filename: ""
default_disk_size: "60G"
default_ram_mb: 8192
default_cpus: 0
