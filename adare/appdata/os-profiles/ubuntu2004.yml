name: ubuntu2004
display_name: "Ubuntu 20.04 LTS (Focal Fossa) Desktop"
platform: linux
distribution: ubuntu
distribution_label: "Focal Fossa"
version: "20.04"
# GUI-automated install of the genuine desktop edition: the vision agent drives
# the graphical ubiquity installer and records a replayable playbook.
install_mode: gui-auto
installer: gui
# The desktop ISO must be supplied with --iso (gui-auto does not auto-download).
#   https://releases.ubuntu.com/20.04/ubuntu-20.04.6-desktop-amd64.iso
#   sha256: 510ce77afcb9537f198bc7daa0e5b503b6e67aaed68146943c231baeaab94df1
iso_url: ""
iso_sha256: ""
iso_filename: ""
default_disk_size: "60G"
default_ram_mb: 8192
default_cpus: 0
requires_uefi: true
# Force a dedicated goal/spec + playbook (gui_ubuntu2004.*) so 20.04 and 18.04
# do not share a recording (their ubiquity installers differ visually).
template: ubuntu2004
