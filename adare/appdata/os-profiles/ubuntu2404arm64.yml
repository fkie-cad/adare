name: ubuntu2404arm64
display_name: "Ubuntu 24.04 LTS (Noble Numbat, ARM64, Desktop overlay on Server base)"
platform: linux
distribution: ubuntu
distribution_label: "Noble Numbat"
version: "24.04"
# Ubuntu publishes no arm64 Desktop ISO, so ARM64 guests are built the proven way:
# the live-server ISO's subiquity autoinstall plus the desktop metapackage
# (see templates/autoinstall_ubuntu_lts.yaml).
install_mode: auto
architecture: aarch64
iso_url: ""
iso_sha256: ""
iso_filename: ""
default_disk_size: "60G"
default_ram_mb: 8192
default_cpus: 0
requires_uefi: true
kernel_path_in_iso: /casper/vmlinuz
initrd_path_in_iso: /casper/initrd
