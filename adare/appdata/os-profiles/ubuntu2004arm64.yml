name: ubuntu2004arm64
display_name: "Ubuntu 20.04 LTS (Focal Fossa, ARM64)"
platform: linux
distribution: ubuntu
distribution_label: "Focal Fossa"
version: "20.04"
architecture: aarch64
requires_uefi: true
# Ubuntu publishes no arm64 Desktop ISO, so ARM64 guests are built the proven way:
# the live-server ISO's subiquity autoinstall plus the desktop metapackage
# (see templates/autoinstall_ubuntu_focal.yaml).
install_mode: auto
installer: subiquity
kernel_path_in_iso: /casper/vmlinuz
initrd_path_in_iso: /casper/initrd
kernel_cmdline: "autoinstall console={console} ---"
seed_label: cidata
iso_url: ""
iso_sha256: ""
iso_filename: ""
default_disk_size: "60G"
default_ram_mb: 8192
default_cpus: 0
