{# adare-template
schema: 1
id: ubuntu-lts-noconda
description: Ubuntu 22.04 / 24.04 LTS desktop (server ISO autoinstall) — no conda, uv baked in
maintainer: ADARE
revision: 2026-07-28
supports:
  # aarch64 only, and deliberately NOT also listed in autoinstall_ubuntu_lts.yaml
  # -- two templates in one directory claiming the same OS name is a discovery
  # error. The x86_64 profiles (ubuntu2204 / ubuntu2404) still use the Miniforge
  # variant in that file; the paper's aarch64 images are built from this one.
  - ubuntu2204arm64
  - ubuntu2404arm64
-#}
{#- Ubuntu 22.04 (jammy) cannot use subiquity's `packages:` list. Jammy's curtin
    leaves devpts unmounted inside /target, so the postinstall apt run cannot
    allocate a pty for its log and dies part-way through ubuntu-desktop-minimal:

      E: Can not write log (Is /dev/pts mounted?) - posix_openpt (19: No such device)
      dpkg-preconfigure: unable to re-open stdin:
      curtin system-install ... returned non-zero exit status 100

    It is a RACE, not deterministic: 22.04 builds from this same template and ISO
    have completed with zero posix_openpt lines, so a green build is not evidence
    of immunity. `apt: conf:` cannot fix it either — curtin deletes its own
    /etc/apt/apt.conf.d/94curtin-config before the package step. The one place
    the setting survives is the apt-get command line, so jammy installs the whole
    package set from late-commands with `-o Dpkg::Use-Pty=false`, exactly as
    autoinstall_ubuntu_focal.yaml does for the identical bug on 20.04.

    24.04 (noble) keeps `packages:`: its curtin mounts devpts, that path is in
    production use for the paper images, and its rendered user-data is
    deliberately left byte-for-byte unchanged by this branch. #}
{%- set apt_pty_broken = os_version == '22.04' -%}
#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  # Match the interface by pattern, never by name -- ADARE pins the NIC to a
  # different PCI address at run time than the installer used, so the predictable
  # name changes between install and run. See hypervisor/qemu/guest_network.py.
  network:
    version: 2
    # Deliberately NO `renderer:` here. Subiquity applies this very section
    # inside the LIVE INSTALLER, which has no NetworkManager, so
    # `renderer: NetworkManager` makes the installer's own `netplan apply` fail
    # and aborts the build with
    #   Command '['netplan', 'apply']' returned non-zero exit status 1
    #   An error occurred. Press enter to start a shell
    # `match: {name: "e*"}` + dhcp4 is renderer-agnostic and already delivers
    # the name-independence described above. NetworkManager is made the renderer
    # of the INSTALLED system by the late-command that writes
    # /etc/netplan/99-adare-nm.yaml.
    ethernets:
      adare-any:
        match:
          name: "e*"
        dhcp4: true
  storage:
    layout:
      name: lvm
      sizing-policy: all
  identity:
    hostname: {{ hostname }}
    username: adare
    password: {{ password_hash }}
  ssh:
    install-server: true
    allow-pw: true
{%- if not apt_pty_broken %}
  packages:
    - ubuntu-desktop-minimal
    {% if setup_level >= 1 %}
    - qemu-guest-agent
    {% endif %}
    {% if setup_level >= 2 %}
    - gnome-screenshot
    - maim
    - xdotool
    - python3-pip
    - python3-tk
    {% endif %}
    # cifs-utils: needed for `mount -t cifs //10.0.2.4/qemu /adare`; without it
    # file transfer silently degrades to the far slower QGA path.
    - cifs-utils
    - openssh-server
    - curl
    - wget
    - git
{%- endif %}
  error-commands:
    # Subiquity keeps apt/curtin output in the installer journal and never puts it
    # on the serial console, so a failed in-target package install reaches the host
    # as nothing but "returned non-zero exit status 100" — undiagnosable. That is
    # exactly what happened to two 22.04 builds on 2026-07-27 (one died on
    # ubuntu-desktop-minimal, one on python3-pip) with no apt line anywhere in
    # <vm>_install.log. Dump the relevant logs to /dev/console, which is the serial
    # port ADARE captures. Mirrors autoinstall_ubuntu_focal.yaml.
    #
    # Deliberately no `poweroff` here: ADARE infers a failed install from the QEMU
    # wait timing out, so powering off would register a broken disk as a good build.
    - |
      { echo '===== ADARE: install FAILED — curtin/apt detail ====='; \
        for f in /var/log/installer/curtin-install.log /var/log/curtin/install.log \
                 /var/log/installer/subiquity-server-debug.log; do \
          [ -f "$f" ] && { echo "--- $f"; tail -n 60 "$f"; }; \
        done; \
        echo '--- apt complaints'; \
        grep -ahiE '^(E|W): |404 |Unable to |broken|conflict|held' \
             /var/log/installer/*.log /var/log/curtin/*.log 2>/dev/null | tail -40; \
        echo '===== ADARE: end of failure detail ====='; } > /dev/console 2>&1 || true
  late-commands:
{%- if apt_pty_broken %}
    # 22.04 only: the whole package set is installed here instead of via
    # `packages:`, because -o Dpkg::Use-Pty=false only survives on the command
    # line. See the note at the top of this file. cifs-utils is load-bearing:
    # ADARE mounts its host share with `mount -t cifs //10.0.2.4/qemu /adare`,
    # and without mount.cifs the host silently degrades to the far slower QGA
    # file-by-file transfer.
    - curtin in-target -- apt-get update
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Use-Pty=false ubuntu-desktop-minimal cifs-utils openssh-server curl wget git
    {% if setup_level >= 1 %}
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Use-Pty=false qemu-guest-agent
    {% endif %}
    {% if setup_level >= 2 %}
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Use-Pty=false gnome-screenshot maim xdotool python3-pip python3-tk
    {% endif %}
{%- endif %}
    # Passwordless sudo for adare user
    - echo "adare ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/adare
    - chmod 440 /target/etc/sudoers.d/adare
    # GDM autologin with X11 (disable Wayland for PyAutoGUI compatibility)
    - mkdir -p /target/etc/gdm3
    - |
      printf '[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=adare\nWaylandEnable=false\n' > /target/etc/gdm3/custom.conf
    # Disable the GNOME initial-setup welcome wizard. Without this the first login
    # shows the fullscreen "Connect your accounts..." Online Accounts screen over the
    # desktop, which breaks every GUI playbook: the dock is not reachable and OCR text
    # matching hits that screen's copy instead of the app. Measured on a rebuilt
    # ubuntu-2204 image (run 01KYJF8N54ZP04ZE1F7K2CDGEJ): the ONLY on-screen match for
    # "Documents" was "...online calendar, documents," from that wizard.
    # autoinstall_ubuntu_rolling.yaml has always done this, which is why the 25.10
    # images run GUI experiments and the LTS images did not.
    - mkdir -p /target/home/adare/.config
    - echo "yes" > /target/home/adare/.config/gnome-initial-setup-done
    - chown -R 1000:1000 /target/home/adare
    # Hand the INSTALLED system's networking to NetworkManager. This cannot be
    # done with `renderer:` in the autoinstall `network:` section -- subiquity
    # applies that section in the live installer, which has no NetworkManager,
    # and the resulting `netplan apply` failure aborts the whole install.
    # NetworkManager claims any ethernet device regardless of its name, which is
    # what survives ADARE re-pinning the NIC to a different PCI address between
    # install and run (enp0s1 -> enp0s31); systemd-networkd only configures what
    # its config names. 99- sorts after the installer's own netplan file, so this
    # file's global `renderer` wins the merge.
    - mkdir -p /target/etc/netplan
    - |
      printf 'network:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    adare-any:\n      match:\n        name: "e*"\n      dhcp4: true\n' > /target/etc/netplan/99-adare-nm.yaml
    - chmod 600 /target/etc/netplan/99-adare-nm.yaml
    # Take systemd-networkd off the boot path. 99-adare-nm.yaml above
    # means netplan emits ONLY NetworkManager connections, so networkd manages
    # zero links -- but the server ISO leaves it and its wait-online unit enabled.
    # systemd-networkd-wait-online then waits for "at least one managed link
    # online", never gets one, and burns its FULL 120s timeout on EVERY boot.
    # cloud-init.service is ordered After= it, sysinit.target after cloud-init,
    # and qemu-guest-agent After=sysinit.target/basic.target -- so the guest agent,
    # which is what ADARE waits on to call the VM ready, is held back 120s.
    #
    # Measured on ubuntu2404arm64-noconda: wait-online 2min 0.291s, sysinit.target
    # @2min 1.1s, QGA at 123.5s. The 25.10 rolling image has both units disabled
    # and reaches QGA in ~10s. Rebuilt LTS images should match that.
    #
    # NetworkManager-wait-online.service stays enabled and still satisfies
    # network-online.target (183ms measured), so no ordering guarantee is lost.
    - curtin in-target -- systemctl disable systemd-networkd-wait-online.service || true
    - curtin in-target -- systemctl mask systemd-networkd-wait-online.service || true
    - curtin in-target -- systemctl disable systemd-networkd.service systemd-networkd.socket || true
    # Disable unattended upgrades to prevent interference during experiments
    - curtin in-target -- systemctl disable unattended-upgrades || true
    - curtin in-target -- apt-get remove -y unattended-upgrades || true
    # Disable APT periodic update/upgrade timers
    - curtin in-target -- systemctl disable apt-daily.timer || true
    - curtin in-target -- systemctl disable apt-daily-upgrade.timer || true
    - curtin in-target -- systemctl mask apt-daily.service || true
    - curtin in-target -- systemctl mask apt-daily-upgrade.service || true
    # Disable APT periodic updates via config
    - 'echo "APT::Periodic::Update-Package-Lists \"0\";" > /target/etc/apt/apt.conf.d/99disable-auto-updates'
    - 'echo "APT::Periodic::Unattended-Upgrade \"0\";" >> /target/etc/apt/apt.conf.d/99disable-auto-updates'
    - 'echo "APT::Periodic::Download-Upgradeable-Packages \"0\";" >> /target/etc/apt/apt.conf.d/99disable-auto-updates'
    # Disable snap auto-refresh
    - mkdir -p /target/etc/snap
    - 'echo "refresh.hold: forever" > /target/etc/snap/snapd.conf || true'
    - curtin in-target -- snap set system refresh.hold="$(date -d '+100 years' +%Y-%m-%dT%H:%M:%S%:z)" || true
    {% if setup_level >= 1 %}
    # Enable QEMU Guest Agent
    - curtin in-target -- systemctl enable qemu-guest-agent
    {% endif %}
    # Ensure adare user exists in target (cloud-init creates it on first boot, but we need it now)
    - curtin in-target -- id adare || curtin in-target -- useradd -m -u 1000 -G sudo -s /bin/bash adare
    - curtin in-target -- mkdir -p /home/adare
    - chown -R 1000:1000 /target/home/adare
    # Allow system pip3 to install adarevm/adarelib wheels without conda.
    # No-conda guests install adarevm into the SYSTEM python: the harness runs
    #   `pip3 install --no-cache-dir --force-reinstall <wheels>`
    # (agent_command_builders, wheels installation_mode). On a stock Ubuntu 24.04
    # system python this hits TWO PEP-668-adjacent walls that the conda path
    # (adarevm into a clean `pyadare` env) never sees. Both are fixed in pip.conf
    # (dedicated VM only — this is a throwaway experiment guest):
    #   1. PEP-668 externally-managed refusal. Load-bearing fix: remove the
    #      EXTERNALLY-MANAGED marker (pip refuses ONLY when it exists;
    #      path-independent, guaranteed). break-system-packages is belt-and-
    #      suspenders in case a future pip re-checks via config.
    #   2. `--force-reinstall` tries to UNINSTALL apt-managed deps (PyYAML,
    #      python-dateutil, ...) that have no pip RECORD file, aborting with
    #      "Cannot uninstall X, RECORD file not found ... installed by debian".
    #      Fix: `ignore-installed = true` makes pip skip the uninstall step and
    #      install the wheels over the apt packages. Validated in-guest: with
    #      this flag the exact harness command shape succeeds (RC=0); without it
    #      it fails on PyYAML. This covers ALL apt-overlapping deps, not just one.
    - curtin in-target -- sh -c 'rm -f /usr/lib/python3.*/EXTERNALLY-MANAGED'
    - 'printf "[global]\nbreak-system-packages = true\nignore-installed = true\n" > /target/etc/pip.conf'
    # Install standalone uv (single binary, NOT conda) — required by `adare vm test`,
    # which launches the shared adarevm source via `uv run adarevm`. Unconditional.
    - curtin in-target -- sh -c 'cd /tmp && curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-unknown-linux-gnu.tar.gz | tar xz && mv uv-aarch64-unknown-linux-gnu/uv uv-aarch64-unknown-linux-gnu/uvx /usr/local/bin/'
    # Disable screen blanking and lock for automated GUI testing
    - curtin in-target -- sudo -u adare dbus-launch gsettings set org.gnome.desktop.session idle-delay 0 || true
    - curtin in-target -- sudo -u adare dbus-launch gsettings set org.gnome.desktop.screensaver lock-enabled false || true
  shutdown: poweroff