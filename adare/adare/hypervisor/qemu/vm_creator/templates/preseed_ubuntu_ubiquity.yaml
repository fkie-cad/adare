{# adare-template
schema: 1
id: ubuntu-ubiquity
description: Ubuntu 20.04 LTS Desktop ISO (GNOME) via ubiquity preseed, fetched over HTTP
maintainer: ADARE
revision: 2026-07-25
supports:
  - ubuntu2004
-#}
{# ubiquity is the installer on the Ubuntu *Desktop* ISO. It consumes the same
   debian-installer answer file as d-i, but has no OEMDRV auto-detect: casper's
   network-preseed init script fetches it from the `url=` on the kernel command
   line, which the profile points at ADARE's ephemeral seed HTTP server
   (10.0.2.2:{seed_port}, see vm_creator/seed_http.py).

   x86_64 only, and shipped UNTESTED — this host is Apple Silicon and cannot boot
   x86_64 guests (see docs: "aarch64 has no desktop ISO"). If a screen still
   prompts, switch the profile to `install_mode: gui-auto` + `installer: gui`. #}
# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us

# Network configuration (DHCP)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string {{ hostname }}
d-i netcfg/get_domain string localdomain
d-i netcfg/hostname string {{ hostname }}

# Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Primary user account (ubiquity reuses the d-i user-setup questions)
d-i passwd/user-fullname string ADARE User
d-i passwd/username string adare
d-i passwd/user-password-crypted password {{ password_hash }}
d-i passwd/user-uid string 1000
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i passwd/auto-login boolean true

# Partitioning: wipe /dev/vda and use the whole disk, no encryption.
# `partman-auto/disk` is explicit because the guest has exactly one virtio disk
# and the seed is served over HTTP rather than attached as a second drive.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# APT / package selection
d-i pkgsel/update-policy select none
d-i popularity-contest/participate boolean false
d-i oem-config/enable boolean false

# GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

# Suppress the remaining ubiquity prompts and reboot when done
d-i debconf/priority select critical
ubiquity ubiquity/summary note
ubiquity ubiquity/reboot boolean true
ubiquity ubiquity/success_command string \
  chroot /target apt-get update; \
  chroot /target env DEBIAN_FRONTEND=noninteractive apt-get install -y \
    openssh-server curl wget git \
    {% if setup_level >= 1 %}qemu-guest-agent{% endif %} \
    {% if setup_level >= 2 %}gnome-screenshot maim xdotool python3-pip python3-tk{% endif %} \
    || true; \
  echo 'adare ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/adare; \
  chmod 0440 /target/etc/sudoers.d/adare; \
  mkdir -p /target/etc/gdm3; \
  printf '[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=adare\nWaylandEnable=false\n' > /target/etc/gdm3/custom.conf; \
  chroot /target systemctl disable unattended-upgrades || true; \
  chroot /target env DEBIAN_FRONTEND=noninteractive apt-get remove -y unattended-upgrades || true; \
  chroot /target systemctl disable apt-daily.timer apt-daily-upgrade.timer || true; \
  chroot /target systemctl mask apt-daily.service apt-daily-upgrade.service || true; \
  printf 'APT::Periodic::Update-Package-Lists "0";\nAPT::Periodic::Unattended-Upgrade "0";\nAPT::Periodic::Download-Upgradeable-Packages "0";\n' > /target/etc/apt/apt.conf.d/99disable-auto-updates; \
  mkdir -p /target/etc/snap; \
  printf 'refresh.hold: forever\n' > /target/etc/snap/snapd.conf || true; \
  {% if setup_level >= 1 %}chroot /target systemctl enable qemu-guest-agent || true; \{% endif %} \
  {% if setup_level >= 2 %}chroot /target wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-{{ miniforge_arch }}.sh -O /tmp/miniforge.sh; \
  chroot /target bash /tmp/miniforge.sh -b -p /home/adare/.miniforge3; \
  chroot /target /home/adare/.miniforge3/bin/conda create -n pyadare python=3.10 pip -y; \
  chroot /target chown -R adare:adare /home/adare/.miniforge3; \
  chroot /target rm -f /tmp/miniforge.sh; \{% endif %} \
  chroot /target sudo -u adare dbus-launch gsettings set org.gnome.desktop.session idle-delay 0 || true; \
  chroot /target sudo -u adare dbus-launch gsettings set org.gnome.desktop.screensaver lock-enabled false || true; \
  true
