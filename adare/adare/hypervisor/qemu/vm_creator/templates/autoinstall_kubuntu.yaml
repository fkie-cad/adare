{# adare-template
schema: 1
id: kubuntu-lts
description: Kubuntu 22.04 / 24.04 (KDE Plasma on an Ubuntu live-server autoinstall base, no conda + uv)
maintainer: ADARE
revision: 2026-07-28
supports:
  - kubuntu2204arm64
  - kubuntu2404arm64
-#}
{# Kubuntu does not publish an arm64 ISO, so ARM64 "Kubuntu" guests are built from
   the Ubuntu live-server ISO of the matching version plus the `kubuntu-desktop`
   metapackage from the Ubuntu archive. The result is the same Plasma desktop and
   the same KDE applications (Dolphin, KWrite, ...) that a Kubuntu-ISO install
   gives, but the base is Ubuntu Server — the profile display_name says so, since
   the difference has to stay visible in the environment metadata.

   Same recipe as autoinstall_ubuntu_lts.yaml except: kubuntu-desktop instead of
   ubuntu-desktop-minimal, SDDM autologin instead of GDM3, and standalone `uv`
   instead of Miniforge (matching the recipe the existing 24.04 ARM64 environment
   was built with, so all paper ARM64 guests stay method-identical). #}
{# NOTE for editors: this comment opens with a bare `{#`, NOT `{#-`. The comment
   block above it ends without a trailing dash, so the newline between the two is
   literal text that becomes a blank line ahead of `#cloud-config` in every
   rendered file. That blank line has been there since this template was written
   and every Kubuntu image in use was built with it, so it is preserved
   deliberately: a `{#-` here would strip it and change 24.04's output.

   Ubuntu 22.04 (jammy) cannot use subiquity's `packages:` list. Jammy's curtin
    leaves devpts unmounted inside /target, so the postinstall apt run cannot
    allocate a pty for its log and dies part-way through the desktop metapackage:

      E: Can not write log (Is /dev/pts mounted?) - posix_openpt (19: No such device)
      dpkg-preconfigure: unable to re-open stdin:
      curtin system-install ... returned non-zero exit status 100

    It is a RACE, not deterministic: jammy builds have completed from an unpatched
    template with zero posix_openpt lines, so a green build is not evidence of
    immunity. `apt: conf:` cannot fix it either — curtin deletes its own
    /etc/apt/apt.conf.d/94curtin-config before the package step. The one place the
    setting survives is the apt-get command line, so jammy installs the whole
    package set from late-commands with `-o Dpkg::Use-Pty=false`, exactly as
    autoinstall_kubuntu_focal.yaml does for the identical bug on 20.04. Losing a
    build here is expensive: kubuntu-desktop is a much larger download than
    ubuntu-desktop-minimal.

    24.04 (noble) keeps `packages:`: its curtin mounts devpts, kubuntu-2404 is the
    environment behind the paper's §5.2 subsecond-precision finding, and its
    rendered user-data is deliberately left byte-for-byte unchanged by this
    branch. Mirrors autoinstall_ubuntu_lts.yaml. #}
{%- set apt_pty_broken = os_version == '22.04' -%}
#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  # Match the interface by pattern, never by name. ADARE runs experiments with the
  # NIC pinned to a different PCI address than the installer used, so the guest's
  # predictable name changes between install and run (enp0s1 -> enp0s31). A config
  # naming one interface leaves the guest with no address at all, which costs a
  # 120s systemd-networkd-wait-online timeout on every boot and breaks the SLIRP
  # SMB share at 10.0.2.4. See hypervisor/qemu/guest_network.py.
  network:
    version: 2
    # Deliberately NO `renderer:` here. Subiquity applies this very section
    # inside the LIVE INSTALLER, which has no NetworkManager, so
    # `renderer: NetworkManager` makes the installer's own `netplan apply` fail
    # and aborts the build with
    #   Command '['netplan', 'apply']' returned non-zero exit status 1
    #   An error occurred. Press enter to start a shell
    # `match: {name: "e*"}` + dhcp4 is renderer-agnostic and already delivers
    # the name-independence described above. NetworkManager is made the renderer
    # of the INSTALLED system by the late-command that writes
    # /etc/netplan/99-adare-nm.yaml.
    ethernets:
      adare-any:
        match:
          name: "e*"
        dhcp4: true
  storage:
    layout:
      name: lvm
      sizing-policy: all
  identity:
    hostname: {{ hostname }}
    username: adare
    password: {{ password_hash }}
  ssh:
    install-server: true
    allow-pw: true
{%- if not apt_pty_broken %}
  packages:
    - kubuntu-desktop
    # cifs-utils: ADARE mounts its host share with `mount -t cifs //10.0.2.4/qemu
    # /adare`. Without mount.cifs that mount fails and the host falls back to
    # per-file QGA writes, which is orders of magnitude slower and times out.
    - cifs-utils
    {% if setup_level >= 1 %}
    - qemu-guest-agent
    {% endif %}
    {% if setup_level >= 2 %}
    - imagemagick
    - maim
    - xdotool
    - python3-pip
    - python3-tk
    {% endif %}
    - openssh-server
    - curl
    - wget
    - git
{%- endif %}
  error-commands:
    # Subiquity swallows apt/curtin output into the installer journal, so a failed
    # in-target package install shows up on the host as nothing but
    # "returned non-zero exit status 100" — undiagnosable. Dump the relevant logs
    # to /dev/console, which is the serial port ADARE captures to
    # <vm>_install.log. Deliberately no `poweroff` here: ADARE detects a failed
    # install by the QEMU wait timing out, so powering off would make a broken
    # disk look like a successful build.
    - |
      { echo '===== ADARE: install FAILED — curtin/apt detail ====='; \
        for f in /var/log/installer/curtin-install.log /var/log/curtin/install.log \
                 /var/log/installer/subiquity-server-debug.log; do \
          [ -f "$f" ] && { echo "--- $f"; tail -n 60 "$f"; }; \
        done; \
        echo '--- apt complaints'; \
        grep -ahiE '^(E|W): |404 |Unable to |broken|conflict|held' \
             /var/log/installer/*.log /var/log/curtin/*.log 2>/dev/null | tail -40; \
        echo '===== ADARE: end of failure detail ====='; } > /dev/console 2>&1 || true
  late-commands:
{%- if apt_pty_broken %}
    # 22.04 only: the whole package set is installed here instead of via
    # `packages:`, because -o Dpkg::Use-Pty=false only survives on the command
    # line. See the note at the top of this file. cifs-utils is load-bearing:
    # ADARE mounts its host share with `mount -t cifs //10.0.2.4/qemu /adare`,
    # and without mount.cifs the host falls back to per-file QGA writes, which is
    # orders of magnitude slower and times out.
    - curtin in-target -- apt-get update
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Use-Pty=false kubuntu-desktop cifs-utils openssh-server curl wget git
    {% if setup_level >= 1 %}
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Use-Pty=false qemu-guest-agent
    {% endif %}
    {% if setup_level >= 2 %}
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Use-Pty=false imagemagick maim xdotool python3-pip python3-tk
    {% endif %}
{%- endif %}
    # Passwordless sudo for adare user
    - echo "adare ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/adare
    - chmod 440 /target/etc/sudoers.d/adare
    # SDDM autologin into the X11 Plasma session (Wayland breaks PyAutoGUI/xdotool).
    # On Plasma 5 (20.04 / 22.04 / 24.04) `plasma.desktop` *is* the X11 session;
    # the Wayland one is `plasmawayland.desktop`.
    - mkdir -p /target/etc/sddm.conf.d
    - |
      printf '[Autologin]\nUser=adare\nSession=plasma.desktop\nRelogin=false\n\n[General]\nDisplayServer=x11\n' > /target/etc/sddm.conf.d/autologin.conf
    # Hand the INSTALLED system's networking to NetworkManager. This cannot be
    # done with `renderer:` in the autoinstall `network:` section -- subiquity
    # applies that section in the live installer, which has no NetworkManager,
    # and the resulting `netplan apply` failure aborts the whole install.
    # NetworkManager claims any ethernet device regardless of its name, which is
    # what survives ADARE re-pinning the NIC to a different PCI address between
    # install and run (enp0s1 -> enp0s31); systemd-networkd only configures what
    # its config names. 99- sorts after the installer's own netplan file, so this
    # file's global `renderer` wins the merge.
    - mkdir -p /target/etc/netplan
    - |
      printf 'network:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    adare-any:\n      match:\n        name: "e*"\n      dhcp4: true\n' > /target/etc/netplan/99-adare-nm.yaml
    - chmod 600 /target/etc/netplan/99-adare-nm.yaml
    # Take systemd-networkd off the boot path. 99-adare-nm.yaml above
    # means netplan emits ONLY NetworkManager connections, so networkd manages
    # zero links -- but the server ISO leaves it and its wait-online unit enabled.
    # systemd-networkd-wait-online then waits for "at least one managed link
    # online", never gets one, and burns its FULL 120s timeout on EVERY boot.
    # cloud-init.service is ordered After= it, sysinit.target after cloud-init,
    # and qemu-guest-agent After=sysinit.target/basic.target -- so the guest agent,
    # which is what ADARE waits on to call the VM ready, is held back 120s.
    #
    # Measured on ubuntu2404arm64-noconda (autoinstall_ubuntu_lts, same shape as
    # this template): wait-online 2min 0.291s, sysinit.target @2min 1.1s, QGA at
    # 123.5s. Disabling the two units in that same guest and rebooting took
    # userspace from 4min 4.6s to 1.2s and QGA from 123.5s to 2.9s.
    #
    # NetworkManager-wait-online.service stays enabled and still satisfies
    # network-online.target (235ms measured), so no ordering guarantee is lost.
    - curtin in-target -- systemctl disable systemd-networkd-wait-online.service || true
    - curtin in-target -- systemctl mask systemd-networkd-wait-online.service || true
    - curtin in-target -- systemctl disable systemd-networkd.service systemd-networkd.socket || true
    # Disable unattended upgrades to prevent interference during experiments
    - curtin in-target -- systemctl disable unattended-upgrades || true
    - curtin in-target -- apt-get remove -y unattended-upgrades || true
    # Disable APT periodic update/upgrade timers
    - curtin in-target -- systemctl disable apt-daily.timer || true
    - curtin in-target -- systemctl disable apt-daily-upgrade.timer || true
    - curtin in-target -- systemctl mask apt-daily.service || true
    - curtin in-target -- systemctl mask apt-daily-upgrade.service || true
    # Disable APT periodic updates via config
    - 'echo "APT::Periodic::Update-Package-Lists \"0\";" > /target/etc/apt/apt.conf.d/99disable-auto-updates'
    - 'echo "APT::Periodic::Unattended-Upgrade \"0\";" >> /target/etc/apt/apt.conf.d/99disable-auto-updates'
    - 'echo "APT::Periodic::Download-Upgradeable-Packages \"0\";" >> /target/etc/apt/apt.conf.d/99disable-auto-updates'
    # Disable snap auto-refresh
    - mkdir -p /target/etc/snap
    - 'echo "refresh.hold: forever" > /target/etc/snap/snapd.conf || true'
    - curtin in-target -- snap set system refresh.hold="$(date -d '+100 years' +%Y-%m-%dT%H:%M:%S%:z)" || true
    {% if setup_level >= 1 %}
    # Enable QEMU Guest Agent
    - curtin in-target -- systemctl enable qemu-guest-agent
    {% endif %}
    # Ensure adare user exists in target (cloud-init creates it on first boot, but we need it now)
    - curtin in-target -- id adare || curtin in-target -- useradd -m -u 1000 -G sudo -s /bin/bash adare
    - curtin in-target -- mkdir -p /home/adare
    - chown -R 1000:1000 /target/home/adare
    # No conda: adarevm/adarelib wheels are installed into the SYSTEM python by
    # the harness (`pip3 install ... <wheels>`). On PEP-668 releases (24.04+) that
    # python is "externally managed" and pip refuses; the stock conda path sidesteps
    # this via conda's own pip. Two measures, safe on a dedicated VM:
    #   1. Remove the EXTERNALLY-MANAGED marker — pip refuses ONLY when it exists,
    #      so removing it eliminates the check. This is the load-bearing fix.
    #      (No-op on 20.04/22.04, which predate the marker.)
    #   2. A global pip.conf flag as well (harmless when the key is ignored).
    - curtin in-target -- sh -c 'rm -f /usr/lib/python3.*/EXTERNALLY-MANAGED'
    - 'printf "[global]\nbreak-system-packages = true\n" > /target/etc/pip.conf'
    # Standalone uv (single binary, NOT conda) — `adare vm test` launches the shared
    # adarevm source via `uv run adarevm`. Unconditional. miniforge_arch doubles as
    # uv's target-triple arch component (aarch64 / x86_64).
    - curtin in-target -- sh -c 'cd /tmp && curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-{{ miniforge_arch }}-unknown-linux-gnu.tar.gz | tar xz && mv uv-{{ miniforge_arch }}-unknown-linux-gnu/uv uv-{{ miniforge_arch }}-unknown-linux-gnu/uvx /usr/local/bin/'
    - curtin in-target -- chown root:root /usr/local/bin/uv /usr/local/bin/uvx
    - chown -R 1000:1000 /target/home/adare
    # Disable screen locking and display power management for automated GUI testing
    - mkdir -p /target/etc/xdg
    - |
      printf '[Daemon]\nAutolock=false\nLockOnResume=false\nLockGrace=0\nTimeout=0\n' > /target/etc/xdg/kscreenlockerrc
    - |
      printf '[AC][DPMSControl]\nidleTime=0\n\n[AC][DimDisplay]\nidleTime=0\n\n[AC][SuspendSession]\nidleTime=0\nsuspendType=0\n' > /target/etc/xdg/powermanagementprofilesrc
  shutdown: poweroff
