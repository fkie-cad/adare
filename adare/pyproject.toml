[project]
name = "adare"
version = "0.1.0"
description = ""
authors = [{name = "miqsoft", email = "mksaxhandball@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "adarelib",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.36",
    "jinja2>=3.1.3",
    "cattrs>=23.2.3",
    "sqlalchemy-serializer>=1.4.1",
    "pyyaml>=6.0.1",
    "nicegui>=1.4.15",
    "retry>=0.9.2",
    "prettytable>=3.9.0",
    "tqdm>=4.66.2",
    "prompt-toolkit>=3.0.43",
    "six>=1.16.0",
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "watchdog>=4.0.0",
    "keyboard>=0.13.5",
    "python-ulid>=2.7.0",
    "textual-dev>=1.7.0",
    "textual>=2.1.1",
    "trogon>=0.6.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "redis>=6.2.0",
    "pandas>=2.3.1",
    "fastmcp>=2.9.2",
    "websockets>=15.0",
    "pillow>=12.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "pycdlib>=1.14.0",
]

[project.scripts]
adare = "adare.run:main"
adareexp = "adare.example:main"

[project.optional-dependencies]
docs = ["sphinx", "sphinx-rtd-theme"]
qemu = ["libvirt-python>=11.0.0"]
# Optional local element-grounding backend for `adare dev agent --ground`:
# the vendored LocateAnything-3B server (torch/MPS). Heavy + NON-COMMERCIAL
# (NVIDIA license) -> opt-in only, local testing. torch/transformers are
# imported lazily inside the server worker, so a base install never loads them.
# torchvision/peft/lmdb/decord are HARD top-level imports in the model's
# trust_remote_code processor/model files (needed even for image-only
# grounding); pillow/numpy/opencv are already in base. transformers is capped
# <5 — the model was built/tested against the 4.x line.
#
# PLATFORM NOTE: everything here resolves to wheels on Linux x86_64 and on
# macOS-arm64 EXCEPT `decord`, which has no macOS-arm64 wheel upstream (and
# eva-decord ships only linux/windows wheels). So `uv sync --extra grounding`
# works on Linux; on macOS-arm64 it cannot install decord — instead point
# ADARE_LOCATE_PYTHON at an interpreter that already has a working decord (e.g.
# built from source), and the server runs there by file path (no adare import).
grounding = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.46,<5",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "peft>=0.11",
    "lmdb>=1.4",
    # decord ships no macOS-arm64 wheel; gate it to linux so the universal
    # uv.lock still resolves on macOS-arm64 (where ADARE_LOCATE_PYTHON is used
    # instead of an in-venv install).
    "eva-decord>=0.6.1; sys_platform == 'linux'",
]

[dependency-groups]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.0.0",
]

[tool.uv.sources]
adarelib = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --disable-warnings"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["adare"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
